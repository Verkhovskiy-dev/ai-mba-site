<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Директор по ИИ · Мой старт</title>
<meta name="description" content="Портал программы «Директор по ИИ» · AI MBA: карта программы, проектный трек, тьютор онбординга и сообщество.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0a0e1a;
    --bg-card: #131829;
    --bg-card-hover: #1a2038;
    --bg-sidebar: #0d1220;
    --border: #1f2740;
    --text: #e4e8f1;
    --text-dim: #8590a8;
    --text-muted: #5a6478;
    --accent: #6b8aff;
    --accent-2: #a78bfa;
    --accent-warm: #f59e0b;
    --accent-green: #34d399;
    --accent-red: #f87171;
    --gradient: linear-gradient(135deg, #6b8aff 0%, #a78bfa 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .app {
    display: flex;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
    height: 100vh;
    position: sticky;
    top: 0;
  }
  .sidebar-brand {
    padding: 0 24px 20px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand .logo {
    font-weight: 700; font-size: 17px;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .sidebar-brand .role {
    font-size: 12px; color: var(--text-dim);
  }

  .nav-section {
    margin-bottom: 16px;
  }
  .nav-section-label {
    padding: 12px 24px 6px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 24px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 14px;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }
  .nav-item:hover {
    background: var(--bg-card);
    color: var(--text);
  }
  .nav-item.active {
    background: rgba(107, 138, 255, 0.08);
    color: var(--text);
    border-left-color: var(--accent);
  }
  .nav-item .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-item .status-dot.completed { background: var(--accent-green); }
  .nav-item .status-dot.current { background: var(--accent); animation: pulse 2s infinite; }
  .nav-item .status-dot.upcoming { background: var(--text-muted); opacity: 0.4; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(107, 138, 255, 0.6); }
    50% { box-shadow: 0 0 0 6px rgba(107, 138, 255, 0); }
  }
  .nav-item .num {
    font-weight: 700;
    color: var(--text-muted);
    min-width: 22px;
    font-size: 12px;
  }
  .nav-item.active .num { color: var(--accent); }
  .nav-item .label { flex: 1; line-height: 1.3; }

  .nav-item-icon {
    font-size: 16px;
    width: 22px; text-align: center;
  }

  /* MAIN CONTENT */
  .content {
    flex: 1;
    padding: 32px 48px;
    max-width: calc(100% - 280px);
    overflow-x: hidden;
  }
  .topline {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .breadcrumb {
    font-size: 13px; color: var(--text-dim);
  }
  .user-info {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px;
  }
  .user-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: white;
  }

  /* Typography */
  h1 {
    font-size: 36px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 700;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 24px;
    line-height: 1.25;
    margin-bottom: 20px;
    margin-top: 36px;
  }
  h3 {
    font-size: 18px;
    margin-bottom: 12px;
  }
  .lead {
    font-size: 17px;
    color: var(--text-dim);
    margin-bottom: 28px;
    max-width: 720px;
  }

  /* CARDS */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  /* DASHBOARD */
  .dash-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .dash-stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .dash-stat .num {
    font-size: 24px; font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 2px;
  }
  .dash-stat .label { font-size: 12px; color: var(--text-dim); }

  .current-module-card {
    background: linear-gradient(135deg, rgba(107, 138, 255, 0.08), rgba(167, 139, 250, 0.03));
    border: 1px solid rgba(107, 138, 255, 0.25);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 28px;
  }
  .current-module-card .tag {
    display: inline-block;
    padding: 4px 10px;
    background: rgba(107, 138, 255, 0.15);
    border-radius: 100px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .current-module-card h2 {
    margin-top: 0;
    margin-bottom: 8px;
  }
  .current-module-card .meta {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .current-module-card .progress-bar {
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .current-module-card .progress-fill {
    height: 100%;
    background: var(--gradient);
  }
  .current-module-card .progress-label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .quick-access {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    margin-top: 24px;
  }
  .quick-link {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .quick-link:hover {
    background: var(--bg-card-hover);
    border-color: rgba(107, 138, 255, 0.3);
    transform: translateY(-1px);
  }
  .quick-link .icon { font-size: 22px; margin-bottom: 8px; }
  .quick-link .name { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  .quick-link .desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; }

  /* HUB — операционная точка входа */
  .hub-hero { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  .hub-hero-stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .hub-pill { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 88px; }
  .hub-pill .n { font-size: 20px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; }
  .hub-pill .l { font-size: 11px; color: var(--text-muted); }
  .hub-section { margin-top: 36px; }
  .hub-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .hub-section-head h2 { margin: 0; font-size: 22px; }
  .hub-section-head p { margin: 0; font-size: 13px; color: var(--text-dim); max-width: 520px; }

  .program-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 1100px) { .program-map { grid-template-columns: repeat(2, 1fr); } }
  .module-tile {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; cursor: pointer; transition: all 0.15s; position: relative; overflow: hidden;
  }
  .module-tile:hover { background: var(--bg-card-hover); border-color: rgba(107,138,255,0.35); transform: translateY(-1px); }
  .module-tile.current { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(107,138,255,0.2); }
  .module-tile.expanded { border-color: var(--accent); background: rgba(107,138,255,0.06); }
  .module-tile .mt-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .module-tile .mt-icon { font-size: 22px; }
  .module-tile .mt-num { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
  .module-tile .mt-name { font-size: 13px; font-weight: 600; line-height: 1.35; flex: 1; }
  .module-tile .mt-days { font-size: 11px; color: var(--text-muted); }
  .module-tile .mt-bar { height: 5px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .module-tile .mt-bar-fill { height: 100%; border-radius: 99px; transition: width 0.3s; }
  .module-tile .mt-pct { font-size: 11px; color: var(--text-muted); margin-top: 5px; display: flex; justify-content: space-between; }
  .module-detail-panel {
    margin-top: 14px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .project-assembly { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; overflow-x: auto; }
  .project-flow { display: flex; align-items: stretch; gap: 0; min-width: max-content; padding-bottom: 4px; }
  .project-stage { flex: 0 0 150px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); margin-right: 8px; }
  .project-stage.done { border-color: rgba(52,211,153,0.45); background: rgba(52,211,153,0.06); }
  .project-stage.active { border-color: rgba(107,138,255,0.5); background: rgba(107,138,255,0.08); }
  .project-stage .ps-sec { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px; }
  .project-stage .ps-title { font-size: 12px; font-weight: 600; line-height: 1.35; margin-bottom: 6px; }
  .project-stage .ps-mod { font-size: 10px; color: var(--text-muted); }
  .project-arrow { color: var(--text-muted); font-size: 18px; align-self: center; margin-right: 8px; }
  .project-final {
    flex: 0 0 180px; padding: 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(107,138,255,0.15), rgba(167,139,250,0.08));
    border: 1px solid rgba(107,138,255,0.35); align-self: stretch;
  }
  .project-layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .project-layer { padding: 12px; border-radius: 10px; border: 1px dashed var(--border); font-size: 12px; color: var(--text-dim); line-height: 1.45; }
  .project-layer strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 13px; }

  .hub-split { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; margin-top: 36px; }
  @media (max-width: 1100px) { .hub-split { grid-template-columns: 1fr; } }
  .tutor-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; min-height: 420px; }
  .tutor-msgs { flex: 1; display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; margin: 14px 0; padding-right: 4px; }
  .tutor-msg-user { align-self: flex-end; max-width: 88%; background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 14px 14px 4px 14px; font-size: 13px; line-height: 1.5; }
  .tutor-msg-bot { align-self: flex-start; max-width: 92%; background: var(--bg-sidebar); border: 1px solid var(--border); padding: 10px 14px; border-radius: 14px 14px 14px 4px; font-size: 13px; line-height: 1.55; }
  .tutor-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .tutor-chip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 11px; cursor: pointer; }
  .tutor-chip:hover { border-color: var(--accent); color: var(--text); }
  .tutor-input-row { display: flex; gap: 8px; margin-top: auto; }
  .tutor-input-row input { flex: 1; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; }
  .tutor-input-row button { padding: 10px 16px; border: none; border-radius: 10px; background: var(--gradient); color: #fff; font-weight: 600; cursor: pointer; }

  .community-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .community-grid { grid-template-columns: 1fr; } }
  .peer-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .peer-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
  .peer-card.you { border-color: rgba(107,138,255,0.4); background: rgba(107,138,255,0.06); }
  .alumni-stat { text-align: center; padding: 14px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .alumni-stat .n { font-size: 22px; font-weight: 800; color: var(--accent); }
  .alumni-stat .l { font-size: 11px; color: var(--text-muted); line-height: 1.35; margin-top: 4px; }

  /* MODULE PAGE */
  .module-header {
    margin-bottom: 28px;
  }
  .module-header .module-num {
    display: inline-block;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .module-header .meta-row {
    display: flex; gap: 16px;
    margin-top: 12px;
    color: var(--text-dim);
    font-size: 13px;
    flex-wrap: wrap;
  }
  .module-header .meta-row span { display: inline-flex; align-items: center; gap: 6px; }
  .module-header .meta-row .dot {
    width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted);
  }
  .module-header .key-q {
    margin-top: 16px;
    padding: 14px 18px;
    background: rgba(107, 138, 255, 0.06);
    border-left: 3px solid var(--accent);
    border-radius: 4px 8px 8px 4px;
    font-style: italic;
    color: var(--text-dim);
  }

  /* DAY TIMELINE */
  .days-timeline {
    margin: 28px 0;
  }
  .day-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .day-block.expanded { border-color: rgba(107, 138, 255, 0.3); }
  .day-header {
    padding: 16px 22px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .day-header:hover { background: var(--bg-card-hover); }
  .day-header .left { display: flex; align-items: center; gap: 16px; flex: 1; }
  .day-header .day-num {
    font-size: 22px;
    font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    min-width: 40px;
  }
  .day-header .day-info { flex: 1; }
  .day-header .day-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .day-header .day-meta { font-size: 12px; color: var(--text-muted); }
  .day-header .toggle {
    color: var(--text-dim);
    font-size: 20px;
    transition: transform 0.2s;
  }
  .day-block.expanded .toggle { transform: rotate(45deg); color: var(--accent); }
  .day-content {
    display: none;
    padding: 0 22px 20px;
    border-top: 1px solid var(--border);
  }
  .day-block.expanded .day-content { display: block; }
  .session-row {
    display: grid;
    grid-template-columns: 110px 130px 1fr;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    font-size: 13px;
  }
  .session-row:last-child { border-bottom: none; }
  .session-time { color: var(--text-dim); font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .session-type {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    height: fit-content;
    align-self: start;
  }
  .session-type.lecture { background: rgba(107, 138, 255, 0.12); color: var(--accent); }
  .session-type.workshop { background: rgba(52, 211, 153, 0.12); color: var(--accent-green); }
  .session-type.handson { background: rgba(245, 158, 11, 0.12); color: var(--accent-warm); }
  .session-speaker { color: var(--accent-warm); font-size: 12px; margin-top: 3px; font-weight: 500; }

  .stack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin: 20px 0; }
  .stack-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stack-card.ok { border-color: rgba(52, 211, 153, 0.45); }
  .stack-card h4 { font-size: 14px; margin-bottom: 10px; }
  .stack-field { margin-bottom: 10px; }
  .stack-field label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stack-field input, .stack-field select, .stack-field textarea {
    width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
  }
  .stack-field textarea { min-height: 56px; resize: vertical; }
  .stack-progress { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
  .stack-progress-fill { height: 100%; background: var(--gradient); border-radius: 99px; transition: width 0.25s; }
  .session-type.defense { background: rgba(167, 139, 250, 0.12); color: var(--accent-2); }
  .session-type.reflection { background: rgba(132, 144, 168, 0.12); color: var(--text-dim); }
  .session-type.guest { background: rgba(248, 113, 113, 0.12); color: var(--accent-red); }
  .session-type.break { background: rgba(60, 70, 90, 0.3); color: var(--text-muted); }
  .session-type.agent-week { background: rgba(245, 158, 11, 0.12); color: var(--accent-warm); }
  .session-title { font-size: 13px; line-height: 1.45; }
  .session-title .ex-link {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(107, 138, 255, 0.1);
    color: var(--accent);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 4px;
    cursor: pointer;
    text-decoration: none;
  }
  .session-title .ex-link:hover { background: rgba(107, 138, 255, 0.2); }

  /* EXERCISES SECTION */
  .exercises-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
    margin-top: 16px;
  }
  .exercise-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .exercise-card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(107, 138, 255, 0.3);
  }
  .exercise-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .exercise-card .id { font-weight: 700; color: var(--accent); font-size: 13px; }
  .exercise-card .trains-pills { display: flex; gap: 4px; }
  .exercise-card .trains-pill {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 100px;
    font-weight: 600;
  }
  .trains-pill.razl { background: rgba(107, 138, 255, 0.15); color: var(--accent); }
  .trains-pill.sred { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); }
  .trains-pill.uver { background: rgba(167, 139, 250, 0.15); color: var(--accent-2); }
  .exercise-card .name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .exercise-card .meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 8px;
  }

  /* EXERCISE DETAIL MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 26, 0.85);
    backdrop-filter: blur(6px);
    z-index: 200;

  @keyframes trajNodeIn { from { opacity: 0; transform: scale(0.1); } to { opacity: 1; transform: scale(1); } }
  @keyframes trajFadeIn { from { opacity: 0; } }
  @keyframes trajFlow { to { stroke-dashoffset: -14; } }
  @keyframes trajScan { 0% { opacity: 0; } 8% { opacity: 0.7; } 92% { opacity: 0.7; } 100% { opacity: 0; } }
  @keyframes trajTrace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes trajTraceFade { 0%, 65% { opacity: 0.95; } 100% { opacity: 0; } }
  .traj-node { transform-box: fill-box; transform-origin: center; animation: trajNodeIn 0.5s cubic-bezier(.2,.8,.2,1) backwards; }
  .traj-dep-flow { animation: trajFlow 0.9s linear infinite; }

  .traj-scan { filter: drop-shadow(0 0 5px #6b8aff); animation: trajScan 2.75s ease forwards; }
  .traj-replay-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 8px;

const PROTOTYPE_BASE = '../Прототипы/Путь_слушателя_v0.1/';

function getPersonalPathState() {
  if (typeof PathStore === 'undefined') return null;
  try { PathStore.syncToPortal(); } catch (e) {}
  return PathStore.load();
}

function pathJourneyPoints() {
  const st = getPersonalPathState();
  if (st && typeof PathStore.journeyPoints === 'function') return PathStore.journeyPoints(st);
  return JOURNEY_POINTS;
}

function pathRouteUI() {
  const st = getPersonalPathState();
  if (st && typeof PathStore.routeForUI === 'function') return PathStore.routeForUI(st);
  return PATH_ROUTE.map(m => ({ mn: m.mn, tt: m.tt, ww: m.ww, emph: m.emph, el: m.el, num: parseInt(m.mn.replace('М', ''), 10) }));
}

function pathNextStep() {
  if (typeof PathStore !== 'undefined') {
    const n = PathStore.getNextStep();
    if (n.portal) return Object.assign({}, n, { inPortal: true });
    const rel = n.url || 'journey_map.html';
    return Object.assign({}, n, { url: rel.indexOf('/') >= 0 ? rel : PROTOTYPE_BASE + rel });
  }
  return { label: 'Пройти чек М1', url: PROTOTYPE_BASE + 'module_check.html?m=1', point: 'Т3', module: 1 };
}

function pathValueMap() {
  const st = getPersonalPathState();
  if (!st || !st.valueMap) return null;
  return st.valueMap;
}

const STATE = {

  constructMode: false,        // true = режим «Конструктор» (клик отмечает выполненным)

const STACK_COMPONENTS = [
  { id: "ide", label: "IDE с агентом", hint: "Cursor, Claude Code, Windsurf" },
  { id: "chat", label: "Frontier-chat", hint: "Claude Pro, ChatGPT Pro, YandexGPT" },

  { id: "kb", label: "Personal KB", hint: "Obsidian, Notion, Logseq" },
  { id: "runner", label: "Agent-runner", hint: "n8n, Agents SDK, Claude Code agent" }
];

  pending: "Не начат",
  progress: "В процессе",
  works: "Работает",
  blocked: "Заблокирован политикой"
};

function defaultPersonalStack() {
  const components = {};
  STACK_COMPONENTS.forEach(c => {
    components[c.id] = { tool: "", status: "pending", smoke: "", cost: "" };
  });
  return {
    version: "v1.0",
    track: "hybrid",
    constraints: ["", ""],
    components,
    commitment: { text: "", deadline: "", done: false },
    upgrades: [],
    updatedAt: null
  };
}

function stackWorkingCount(stack) {
  stack = stack || STATE.personalStack || defaultPersonalStack();
  return STACK_COMPONENTS.filter(c => stack.components[c.id]?.status === "works").length;
}

function ensurePersonalStack() {
  if (!STATE.personalStack) {
    STATE.personalStack = defaultPersonalStack();
    return STATE.personalStack;
  }
  const def = defaultPersonalStack();
  if (!STATE.personalStack.components) STATE.personalStack.components = {};
  STACK_COMPONENTS.forEach(c => {
    if (!STATE.personalStack.components[c.id]) STATE.personalStack.components[c.id] = { ...def.components[c.id] };
  });
  if (!Array.isArray(STATE.personalStack.constraints)) STATE.personalStack.constraints = [...def.constraints];
  if (!STATE.personalStack.commitment) STATE.personalStack.commitment = { ...def.commitment };
  if (!Array.isArray(STATE.personalStack.upgrades)) STATE.personalStack.upgrades = [];
  if (!STATE.personalStack.track) STATE.personalStack.track = def.track;
  if (!STATE.personalStack.version) STATE.personalStack.version = def.version;
  return STATE.personalStack;
}

function updateStackField(compId, field, value) {
  ensurePersonalStack();
  if (!STATE.personalStack.components[compId]) STATE.personalStack.components[compId] = {};
  STATE.personalStack.components[compId][field] = value;
  STATE.personalStack.updatedAt = new Date().toISOString();
  saveState();
  renderContent();
}

function updateStackMeta(field, value) {
  ensurePersonalStack();
  STATE.personalStack[field] = value;
  STATE.personalStack.updatedAt = new Date().toISOString();
  saveState();
}

function updateStackConstraint(idx, value) {
  ensurePersonalStack();
  STATE.personalStack.constraints[idx] = value;
  saveState();
}

function updateStackCommitment(field, value) {
  ensurePersonalStack();
  STATE.personalStack.commitment[field] = value;
  saveState();
}

function addStackUpgrade() {
  ensurePersonalStack();
  const mod = STATE.currentModule;
  STATE.personalStack.upgrades.push({
    module: mod,
    date: new Date().toISOString().slice(0, 10),
    added: "",
    removed: "",
    why: ""
  });
  STATE.personalStack.updatedAt = new Date().toISOString();
  tryMarkStackV9();
  saveState();
  renderContent();
}

function tryMarkStackV9() {
  const filled = (STATE.personalStack?.upgrades || []).filter(u => (u.added || u.removed || u.why || "").trim());
  if (filled.length >= 9 && !STATE.firedTriggers.has("c.stack.v9")) {
    STATE.firedTriggers.add("c.stack.v9");
    saveState();
    showTriggerModal("c.stack.v9");
  }
}

function updateStackUpgrade(idx, field, value) {
  ensurePersonalStack();
  if (STATE.personalStack.upgrades[idx]) {
    STATE.personalStack.upgrades[idx][field] = value;
    saveState();
  }
}

function tryMarkStackV1() {
  const n = stackWorkingCount();
  if (n < 5) {
    alert("Для v1.0 нужно минимум 5 из 6 компонентов со статусом «Работает». Сейчас: " + n);
    return;
  }
  if (!STATE.personalStack.commitment.text.trim()) {
    alert("Заполните public commitment (E1.4) — одно проверяемое обязательство на неделю.");
    return;

  if (!STATE.firedTriggers.has("c.stack.v1")) {
    STATE.firedTriggers.add("c.stack.v1");
    saveState();
    showTriggerModal("c.stack.v1");
  }
  renderContent();
}

};
const ARENA_ORDER = ["content", "project", "social"];
function arenaOfTrigger(t) {
  const id = t.id;
  if (t.traj === "soc" || id === "con.start") return "social";              // люди / сообщество / онбординг-знакомство
  if (id.startsWith("ep.4") || id.endsWith(".done") || id === "diag.eval.M4" || id === "m1.ex_check") return "project"; // строит/защищает пилот
  return "content";                                                          // знание, понятия, разделы, дискуссии, диагностики
}
// Взвешенный вклад: подтверждающие действия весят больше осваивающих
const ARENA_W = { check: 3, learn: 1 };
const arenaWeight = t => ARENA_W[modeOfTrigger(t)];
// Взвешенный % по арене среди заданного множества триггеров и набора закрытых id
function arenaPct(arena, firedSet, triggers) {
  const list = (triggers || TRIGGERS).filter(t => arenaOfTrigger(t) === arena);
  const total = list.reduce((s, t) => s + arenaWeight(t), 0);
  const done = list.reduce((s, t) => s + (firedSet.has(t.id) ? arenaWeight(t) : 0), 0);
  return total ? Math.round(done / total * 100) : 0;
}
// Радар по 3 аренам (треугольник)
function arenaRadarSVG(firedSet, opts) {
  opts = opts || {};
  const size = opts.size || 240, cx = size / 2, cy = size / 2, R = size * 0.3, triggers = opts.triggers;
  const ang = { content: -90, project: 30, social: 150 };
  const pt = (ar, f) => { const a = ang[ar] * Math.PI / 180; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
  const vals = ARENA_ORDER.map(ar => ({ ar, v: arenaPct(ar, firedSet, triggers) }));
  const rings = [0.33, 0.66, 1].map(f => `<polygon points="${ARENA_ORDER.map(ar => pt(ar, f).map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#23304d" stroke-width="1"/>`).join("");
  const axes = ARENA_ORDER.map(ar => { const [x, y] = pt(ar, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a3350" stroke-width="1"/>`; }).join("");
  const poly = vals.map(({ ar, v }) => pt(ar, Math.max(v, 1) / 100).map(n => n.toFixed(1)).join(",")).join(" ");
  const dots = vals.map(({ ar, v }) => { const [x, y] = pt(ar, Math.max(v, 1) / 100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${ARENA_META[ar].color}" stroke="#0a0e1a" stroke-width="1"/>`; }).join("");
  const labels = vals.map(({ ar, v }) => { const [x, y] = pt(ar, 1.26); return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" fill="${ARENA_META[ar].color}" font-size="11" font-weight="700">${ARENA_META[ar].icon} ${v}%</text>`; }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="overflow:visible;">
    ${rings}${axes}
    <polygon points="${poly}" fill="#8b9dff" fill-opacity="0.2" stroke="#9db4ff" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}
function arenaBars(firedSet, triggers) {
  return ARENA_ORDER.map(ar => {
    const v = arenaPct(ar, firedSet, triggers), m = ARENA_META[ar];
    return `<div style="margin-bottom:9px;">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:4px;"><span style="color:${m.color}; font-weight:700;">${m.icon} ${m.label}</span><span style="font-family:ui-monospace,Menlo,monospace; color:${m.color}; font-weight:700;">${v}%</span></div>
      <div style="height:7px; background:var(--bg); border-radius:100px; overflow:hidden;"><div style="height:100%; width:${v}%; background:${m.color}; transition:width 0.4s;"></div></div>
      <div style="font-size:10px; color:var(--text-muted); margin-top:3px;">${m.hint}</div>
    </div>`;
  }).join("");
}

// Программа работает в формате 9 модулей × 4 очных дня (36 дней).
// Расписания и карточки модулей заданы нативно в 36-дневной сетке
// (последний день модуля — два блока: контент + защита, как в план-карте).
const DAYS_PER_MODULE = 4;
const TOTAL_DAYS = 36;
// Данные триггеров и зависимостей исторически в 45-дневной сетке — пересчёт:
const day4 = oldDay => {
  const moduleIndex = Math.floor((oldDay - 1) / 5);
  const dayInModule = (oldDay - 1) % 5 + 1;
  return moduleIndex * DAYS_PER_MODULE + Math.min(dayInModule, DAYS_PER_MODULE);
};

  module.artifacts.push("Живая схема модуля: общая → групповая → индивидуальная");
});

  if (trigger.day) trigger.day = day4(trigger.day);
});
TRAJ_DEPS.forEach(dep => {
  if (dep.from && dep.from.day) dep.from.day = day4(dep.from.day);
  if (dep.to && dep.to.day) dep.to.day = day4(dep.to.day);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

function trainPill(label) {
  const mapClass = { "РАЗЛ": "razl", "СРЕД": "sred", "УВЕР": "uver" };
  return `<span class="trains-pill ${mapClass[label]}">${label}</span>`;
}

function findExercise(exId) {
  for (const k in EXERCISES_BY_MODULE) {
    const hit = EXERCISES_BY_MODULE[k].find(e => e.id === exId);
    if (hit) return hit;
  }
  return null;
}

function moduleTileStatus(m) {
  if (m.num < STATE.currentModule) return "completed";
  if (m.num === STATE.currentModule) return "current";
  return "upcoming";
}

function moduleReadiness(m) {
  const triggers = TRIGGERS.filter(t => t.module === m);
  if (!triggers.length) return 0;
  const done = triggers.filter(t => STATE.firedTriggers.has(t.id)).length;
  return Math.round(done / triggers.length * 100);
}

function moduleReadinessAxes(m) {
  const axes = [
    { key: "ep", label: "Понимаю", color: TRAJECTORY_LABELS.ep.color },
    { key: "con", label: "Уверен", color: TRAJECTORY_LABELS.con.color },
    { key: "co", label: "Строю", color: TRAJECTORY_LABELS.co.color }
  ];
  return axes.map(ax => {
    const list = TRIGGERS.filter(t => t.module === m && t.traj === ax.key);
    const pct = list.length ? Math.round(list.filter(t => STATE.firedTriggers.has(t.id)).length / list.length * 100) : 0;
    return { ...ax, pct };
  });
}

function toggleHubModule(num) {
  STATE.hubExpandedModule = STATE.hubExpandedModule === num ? null : num;
  renderContent();
}

function projectSectionsDone() {
  return PROJECT_SECTIONS.filter(s => STATE.firedTriggers.has(s.trigger)).length;
}

function renderModule(num) {
  const mod = MODULES.find(m => m.num === num);
  if (!mod) return `<div class="placeholder">Модуль не найден</div>`;

  let scheduleHtml = '';
  const moduleSchedule = ALL_SCHEDULES[num];
  if (mod.fullSchedule && moduleSchedule) {
    scheduleHtml = `
      <h2>Расписание по дням</h2>
      <div class="days-timeline">
        ${moduleSchedule.map(d => {
          const expanded = STATE.expandedDay === d.day;
          return `
            <div class="day-block ${expanded ? 'expanded' : ''}">
              <div class="day-header" onclick="toggleDay(${d.day})">
                <div class="left">
                  <div class="day-num">Д${d.day}</div>
                  <div class="day-info">
                    <div class="day-name">${esc(d.theme)}</div>
                    <div class="day-meta">${d.sessions.length} сессий</div>
                  </div>
                </div>
                <div class="toggle">+</div>
              </div>
              <div class="day-content">
                ${d.sessions.map(s => `
                  <div class="session-row">
                    <div class="session-time">${esc(s.time)}</div>
                    <div><span class="session-type ${s.type}">${esc(s.typeLabel)}</span></div>
                    <div class="session-title">
                      ${esc(s.title)}
                      ${s.speaker ? `<div class="session-speaker">${esc(s.speaker)}</div>` : ''}
                      ${s.exId ? `<a class="ex-link" onclick="showExercise('${s.exId}')">${s.exId}</a>` : ''}
                      ${s.stackLink ? `<a class="ex-link" onclick="navigate('personal-stack')">Стек →</a>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  } else {
    scheduleHtml = `
      <h2>Программа дней</h2>
      <div class="days-timeline">
        ${mod.dayThemes.map((theme, idx) => {
          const dayNum = (num - 1) * 4 + idx + 1;
          return `
            <div class="day-block">
              <div class="day-header" style="cursor: default;">
                <div class="left">
                  <div class="day-num">Д${dayNum}</div>
                  <div class="day-info">
                    <div class="day-name">${esc(theme)}</div>
                    <div class="day-meta">Детальное расписание в разработке командой М${num}</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  let exercisesHtml = '';
  const exList = EXERCISES_BY_MODULE[num];
  if (exList) {
    exercisesHtml = `
      <h2>Упражнения модуля (${exList.length})</h2>
      <p style="color: var(--text-dim); margin-bottom: 16px; font-size: 14px;">
        Каждое упражнение тренирует одну или несколько подзадач производства знания:
        <span class="trains-pill razl">РАЗЛ</span> различать ·
        <span class="trains-pill sred">СРЕД</span> иметь средство ·
        <span class="trains-pill uver">УВЕР</span> быть уверенным
      </p>
      <div class="exercises-grid">
        ${exList.map(ex => `
          <div class="exercise-card" onclick="showExercise('${ex.id}')">
            <div class="top">
              <div class="id">${ex.id}</div>
              <div class="trains-pills">${ex.trains.map(trainPill).join('')}</div>
            </div>
            <div class="name">${esc(ex.name)}</div>
            <div class="meta">
              <span>День ${ex.day}</span>
              <span>·</span>
              <span>${esc(ex.duration)}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else {
    const mPath = typeof PathStore !== 'undefined' ? (PathStore.load().modules['M' + num] || {}) : {};
    const pw = typeof PathStore !== 'undefined' ? PathStore.preworkProgress(PathStore.load(), num) : { n: 0, total: 5 };
    exercisesHtml = `
      <h2>Подготовка и упражнения · М${num}</h2>
      <div class="placeholder" style="opacity:1;">
        <h3>Личная траектория модуля</h3>
        <p>Чек средств мышления → план → pre-work → дни модуля в расписании.</p>
        <p style="margin-top:10px;color:var(--text-dim);font-size:13px;">
          Чек: ${mPath.checkDone ? '✓ пройден' : '○ не пройден'} ·
          План: ${mPath.planViewed ? '✓ открыт' : '○'} ·
          Pre-work: ${pw.n}/${pw.total}
        </p>
        <button class="btn-primary" style="margin-top:14px;" onclick="location.href='${PROTOTYPE_BASE}module_check.html?m=${num}'">
          ${mPath.checkDone ? 'Открыть план / pre-work →' : 'Пройти чек М' + num + ' →'}
        </button>
        <p style="margin-top: 12px;font-size:12px;color:var(--text-muted);">Полный каталог упражнений М${num} — по мере публикации командой модуля (эталон: М1, 19 упражнений).</p>
      </div>

  return `
    <div class="topline">
      <div class="breadcrumb">Модули · М${num}</div>
      <div class="user-info">
        <span>${esc(STATE.user.company)}</span>
        <div class="user-avatar">${esc(initials(STATE.user.name))}</div>
      </div>
    </div>

    <div class="module-header">
      <div class="module-num">МОДУЛЬ ${num}${mod.status === 'current' ? ' · ТЕКУЩИЙ' : ''}</div>
      <h1>${esc(mod.icon)} ${esc(mod.name)}</h1>
      <div class="meta-row">
        <span>📅 Дни ${esc(mod.days)}</span>
        <span class="dot"></span>
        <span>🏛 ${esc(mod.partner)}</span>
        <span class="dot"></span>
        <span>📊 ${exList ? exList.length + ' упражнений' : 'упражнения в разработке'}</span>
      </div>
      <div class="key-q">${esc(mod.keyQuestion)}</div>
    </div>

    <div class="hub-section" style="margin-top:0;">
      <div class="hub-section-head">
        <h2>Ритм модуля: действие → рефлексия → новое действие</h2>
        <p>Схемы строятся вживую: общая → групповая → индивидуальная. ИИ подключается после содержательной сборки.</p>
      </div>
      <div class="quick-access" style="margin-top:0;">
        <div class="quick-link"><div class="icon">1</div><div class="name">Ситуация</div><div class="desc">Проблематизация · схема v0</div></div>
        <div class="quick-link"><div class="icon">2</div><div class="name">Пленарная сборка</div><div class="desc">Средства · схема v1</div></div>

    ${scheduleHtml}

    ${exercisesHtml}

    <h2>Артефакты, которые слушатель производит</h2>
    <div class="artifacts-list">
      ${mod.artifacts.map(a => `<div class="artifact-item">✓ ${esc(a)}</div>`).join('')}

  `;
}

function triggerTypePill(type) {
  const t = TRIGGER_TYPE_LABELS[type];
  if (!t) return '';
  return `<span style="display: inline-block; padding: 2px 7px; border-radius: 100px; background: ${t.color}22; color: ${t.color}; font-size: 9px; font-weight: 700; letter-spacing: 0.04em;">${t.label}</span>`;
}

function getTriggerStats(firedSet) {
  firedSet = firedSet || STATE.firedTriggers;
  const stats = { ep: { fired: 0, total: 0 }, con: { fired: 0, total: 0 }, co: { fired: 0, total: 0 }, soc: { fired: 0, total: 0 } };
  TRIGGERS.forEach(t => {
    stats[t.traj].total++;
    if (firedSet.has(t.id)) stats[t.traj].fired++;
  });
  return stats;
}

function fireTrigger(triggerId) {
  const trig = TRIGGERS.find(t => t.id === triggerId);
  if (!trig) return;
  if (!trig.type.includes('SELF')) {
    alert('Этот триггер не самоотчётный. Его фиксирует: ' + trig.verifier);
    return;
  }
  if (STATE.firedTriggers.has(triggerId)) {
    STATE.firedTriggers.delete(triggerId);
  } else {
    STATE.firedTriggers.add(triggerId);
  }
  if (typeof saveState === 'function') saveState();
  showTriggerModal(triggerId);
  renderContent();
}

/* ============================================================
   СИМУЛЯТОР ТРАЕКТОРИИ — правила, рендер панели и прогноза
   ============================================================ */

const AXIS_LABEL = { ep: "🔁 Эпистемика", con: "📚 Содержание", co: "🏗 Конструктив", soc: "🤝 Социальная" };

// Бонус к фокусу осей в зависимости от роли
const ROLE_BONUS = {
  caio:     { ep: 0.00, con: 0.10, co: 0.00, soc: 0.20 },
  strateg:  { ep: 0.05, con: 0.20, co: 0.00, soc: 0.10 },
  product:  { ep: 0.05, con: 0.15, co: 0.10, soc: 0.05 },
  engineer: { ep: 0.15, con: 0.00, co: 0.20, soc: 0.00 }
};

// Какие активности «зажигают» какие типы триггеров
function activityMeetsType(type, act) {
  return (type === "PEER" && act.peer)
    || (type === "ARTIFACT" && act.artifacts)
    || ((type === "TEAM" || type === "EXPERT") && act.talks)
    || (type === "MOD" && (act.guest || act.peer))
    || (type === "SELF");  // SELF доступен всегда, но регулируется фокусом оси
}

function runSimulation() {
  const s = STATE.sim;
  const act = s.activities;
  const rb = ROLE_BONUS[s.role] || { ep: 0, con: 0, co: 0, soc: 0 };
  const factor = a => Math.max(0, Math.min(1.2,
    s.focus[a] / 35 + (rb[a] || 0) + (s.maturity - 3) * 0.05 + (a === "soc" && act.mentor ? 0.15 : 0)
  ));

  const isAuto = t => t.type.some(x => x === "AUTO" || x === "DIAG");
  const fired = new Set();

  ["ep", "con", "co", "soc"].forEach(axis => {
    const inAxis = TRIGGERS.filter(t => t.traj === axis);
    // AUTO/DIAG срабатывают всегда (система/Assessment Agent фиксирует автоматически)
    inAxis.forEach(t => { if (isAuto(t)) fired.add(t.id); });
    // Остальные — только если активность включена; сколько именно зажжётся, задаёт фокус оси
    const cands = inAxis
      .filter(t => !isAuto(t) && t.type.some(x => activityMeetsType(x, act)))
      .sort((a, b) => a.day - b.day);
    const n = Math.round(cands.length * factor(axis));
    cands.slice(0, n).forEach(t => fired.add(t.id));
  });

  const axisBalance = {};
  ["ep", "con", "co", "soc"].forEach(axis => {
    const tot = TRIGGERS.filter(t => t.traj === axis).length || 1;
    const fr = TRIGGERS.filter(t => t.traj === axis && fired.has(t.id)).length;
    axisBalance[axis] = Math.round(fr / tot * 100);
  });
  const projectPercent = Math.round(axisBalance.co * 0.7 + axisBalance.con * 0.3);

  // Узкие места
  const goalThresh = { project: { co: 80 }, network: { soc: 70 }, competence: { ep: 75 } }[s.goal] || {};
  const risks = [];
  ["ep", "con", "co", "soc"].forEach(axis => {
    const th = goalThresh[axis] || 55;
    if (axisBalance[axis] < th) risks.push(`${AXIS_LABEL[axis]}: набирается лишь ${axisBalance[axis]}% (нужно ≥${th}%).`);
  });
  let depCount = 0;
  for (const d of TRAJ_DEPS) {
    if (depCount >= 2) break;
    if (axisBalance[d.from.track] < 55) {
      risks.push(`Связь «${d.from.label} → ${d.to.label}» под угрозой: ось-источник ${AXIS_LABEL[d.from.track]} — ${axisBalance[d.from.track]}%.`);
      depCount++;
    }
  }
  if (!act.talks) risks.push("Без «Выступлений / защит» не зачтутся защиты модулей (TEAM/EXPERT) — содержание и проект не соберутся.");
  if (!act.artifacts) risks.push("Без сдачи артефактов не закроются разделы Программы (ARTIFACT) — конструктив проседает.");
  if (!act.peer) risks.push("Без peer-тройки не сработают PEER-триггеры социальной оси.");

  STATE.simResult = { fired, axisBalance, projectPercent, triggersFired: fired.size, risks: risks.slice(0, 6) };
  renderContent();
}

function setTrajMode(mode) {
  STATE.constructMode = (mode === "construct");
  STATE.simMode = (mode === "sim");
  STATE._shownDeps = null;   // перепроиграть прорисовку стрелок под новый режим
  renderContent();
}
function toggleConstruct(id) {
  if (STATE.constructFired.has(id)) STATE.constructFired.delete(id);
  else STATE.constructFired.add(id);
  renderContent();
}
function resetConstruct() { STATE.constructFired = new Set(); STATE._shownDeps = null; renderContent(); }
// Единый клик по активности: в Конструкторе — отметить/снять; всегда — подсветить на карте «что на что влияет».
function actClick(id) {
  if (STATE.constructMode) {
    if (STATE.constructFired.has(id)) STATE.constructFired.delete(id);
    else STATE.constructFired.add(id);
  }
  STATE.focusKey = id;
  renderContent();
}
