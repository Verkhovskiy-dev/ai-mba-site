/* ============================================================
   КОНСТРУКТОР СРЕДСТВА — 3 грани способности + формирующие связи
   ============================================================ */

function renderMeans() {
  const constructMode = STATE.constructMode;
  const simOn = !constructMode && STATE.simMode && STATE.simResult;
  const activeFired = constructMode ? STATE.constructFired : (simOn ? STATE.simResult.fired : STATE.firedTriggers);
  const currentGlobalDay = (STATE.currentModule - 1) * 4 + STATE.currentDay;

  // Уровень собирается по ДОЛЕ закрытых активностей, что на него работают (а не только по ключевому).
  const closed = id => activeFired.has(id);
  const trig = id => TRIGGERS.find(t => t.id === id);
  const triadOf = m => meanTriad(m);
  const lvlFrac = (m, lvl) => { const a = feedersOf(m, lvl); return a.length ? a.filter(x => closed(x.id)).length / a.length : 0; };
  const lvlClosed = (m, lvl) => lvlFrac(m, lvl) >= 1;
  const masteredOf = m => lvlClosed(m, "dist") && lvlClosed(m, "real") && lvlClosed(m, "conf");
  const masteredCount = MEANS_ITEMS.filter(it => masteredOf(it.m)).length;
  const lvlCount = lvl => MEANS_ITEMS.filter(it => lvlClosed(it.m, lvl)).length;
  const GOLD = "#fcd34d";

  // Обратная подсветка: какая активность выбрана и на какое средство/уровень влияет
  const focusId = STATE.focusKey && trig(STATE.focusKey) ? STATE.focusKey : null;
  const focusT = focusId ? trig(focusId) : null;
  const focusM = focusT ? focusT.module : null;
  const focusLvl = focusT ? levelOfTrigger(focusT) : null;

  // ПОЗИЦИЯ НА ТРАЕКТОРИИ — не по календарю, а по ПОДТВЕРЖДЕНИЮ.
  // Рубеж появляется только если закрыто подтверждающее действие (артефакт, защита, задача, квиз/тест).
  const confirmedArtifacts = TRIGGERS.filter(t => modeOfTrigger(t) === "check" && closed(t.id));
  const frontier = confirmedArtifacts.length ? confirmedArtifacts.reduce((a, b) => (b.day > a.day ? b : a)) : null;
  // Лёгкий «след освоения» — самая поздняя любая закрытая активность (чем участник прорисовал путь)
  const engagedAll = TRIGGERS.filter(t => closed(t.id));
  const engaged = engagedAll.length ? engagedAll.reduce((a, b) => (b.day > a.day ? b : a)) : null;

  // Геометрия: модули по горизонтали, 3 уровня средства по вертикали
  const W = 1100, H = 460;
  const dayX = day => 60 + (day - 1) * ((W - 110) / 35);
  const meanX = m => dayX(m * 4 - 1.5);
  const laneY = { dist: 120, real: 240, conf: 360 };
  const ANIM_SPAN = 2.6;
  const dlyM = m => ((m - 1) / 8 * ANIM_SPAN).toFixed(2);
  const linkPath = (a, b) => { const my = (a.y + b.y) / 2; return `M ${a.x} ${a.y} C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`; };

  // Анимация витковых стрелок — только у вновь освоенных средств
  const prevShown = STATE._shownDeps instanceof Set ? STATE._shownDeps : new Set();
  const curShown = new Set();
  MEANS_ITEMS.forEach(it => { if (masteredOf(it.m)) curShown.add('m' + it.m); });
  STATE._shownDeps = curShown;

  const lanes = [["dist", laneY.dist], ["real", laneY.real], ["conf", laneY.conf]];

  const svg = `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%; min-width:960px; height:${H}px;">
      <defs>
        <marker id="m-arrow-step" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/></marker>
      </defs>

      <!-- Полосы уровней средства -->
      ${lanes.map(([f, y]) => `
        <rect x="14" y="${y - 42}" width="${W - 28}" height="84" rx="12" fill="${MEANS[f].color}" opacity="0.05"/>
        <rect x="14" y="${y - 42}" width="3" height="84" rx="2" fill="${MEANS[f].color}" opacity="0.7"/>
        <text x="24" y="${y - 20}" fill="${MEANS[f].color}" font-size="13" font-weight="800">${MEANS[f].icon} ${MEANS[f].name}</text>
        <text x="24" y="${y - 5}" fill="#8590a8" font-size="10">${MEANS[f].sub}</text>
      `).join("")}

      <!-- Витковые переходы: освоил средство → берёшься за следующее -->
      ${MEANS_ITEMS.slice(0, -1).map(it => {
        const m = it.m;
        if (!masteredOf(m)) return "";
        const a = { x: meanX(m), y: laneY.conf }, b = { x: meanX(m + 1), y: laneY.dist };
        const isNew = !prevShown.has('m' + m);
        const dd = (parseFloat(dlyM(m)) + 0.35).toFixed(2);
        const cls = isNew ? "traj-dep" : "traj-dep-flow";
        const st = isNew ? ` style="animation-delay:${dd}s, ${dd}s"` : "";
        const tracer = isNew ? `<path class="traj-dep-trace" style="animation-delay:${dd}s, ${dd}s" pathLength="1" d="${linkPath(a, b)}" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>` : "";
        return `<path class="${cls}"${st} d="${linkPath(a, b)}" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="4,3" opacity="0.45" marker-end="url(#m-arrow-step)"><title>Средство М${m} освоено → берёшься за М${m + 1} (новый виток)</title></path>${tracer}`;
      }).join("")}

      <!-- Подсветка выбранной активности: её средство-колонка -->
      ${focusM ? `<rect x="${meanX(focusM) - 26}" y="64" width="52" height="${laneY.conf + 22 - 64}" rx="11" fill="${GOLD}" opacity="0.06"/>
        <rect x="${meanX(focusM) - 26}" y="64" width="52" height="${laneY.conf + 22 - 64}" rx="11" fill="none" stroke="${GOLD}" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.85"/>` : ''}

      <!-- Средства: триады с кольцами прогресса. Кольцо заполнено = уровень сошёлся -->
      ${MEANS_ITEMS.map(it => {
        const m = it.m, x = meanX(m), mastered = masteredOf(m);
        const k = ['dist', 'real', 'conf'].filter(l => lvlClosed(m, l)).length;
        const delay = dlyM(m);
        const conn = mastered
          ? `<line x1="${x}" y1="${laneY.dist}" x2="${x}" y2="${laneY.conf}" stroke="${GOLD}" stroke-width="3" opacity="0.9" style="filter:drop-shadow(0 0 4px ${GOLD})"/>`
          : `<line x1="${x}" y1="${laneY.dist}" x2="${x}" y2="${laneY.conf}" stroke="#2a3350" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>`;
        // Узел-уровень = кольцо прогресса по доле закрытых активностей
        const node = (lvl, y) => {
          const col = MEANS[lvl].color, gateId = triadOf(m)[lvl];
          const acts = feedersOf(m, lvl);
          const done = acts.filter(a => closed(a.id)).length;
          const frac = acts.length ? done / acts.length : 0;
          const full = frac >= 1;
          const R = 9, Cc = 2 * Math.PI * R;
          const isFocus = (m === focusM && lvl === focusLvl);
          const clk = `actClick('${gateId}')`;
          const tt = `Уровень «${MEANS[lvl].name}» средства М${m} · закрыто ${done}/${acts.length}${full ? ' · СОШЛОСЬ' : ''}. Клик — ключевое действие.`;
          const halo = isFocus ? `<circle cx="${x}" cy="${y}" r="16" fill="none" stroke="${GOLD}" stroke-width="2" opacity="0.9"/>` : "";
          return `<g class="traj-node" style="cursor:pointer; animation-delay:${delay}s" onclick="${clk}">
            ${halo}
            <circle cx="${x}" cy="${y}" r="${R}" fill="${full ? col + '22' : '#0d1322'}" stroke="#23304d" stroke-width="2.5"/>
            <circle cx="${x}" cy="${y}" r="${R}" fill="none" stroke="${full && mastered ? GOLD : col}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${(frac * Cc).toFixed(1)} ${Cc.toFixed(1)}" transform="rotate(-90 ${x} ${y})"/>
            <circle cx="${x}" cy="${y}" r="3" fill="${full ? (mastered ? GOLD : col) : 'none'}"/>
            <title>${tt}</title>
          </g>`;
        };
        // Точки-питатели: каждая активность уровня. Круг = осваиваю, квадрат = подтверждаю.
        const pipRow = (lvl, y) => {
          const col = MEANS[lvl].color, gateId = triadOf(m)[lvl];
          const acts = feedersOf(m, lvl);
          return acts.map((f, i) => {
            const px = x - (acts.length - 1) * 4.5 + i * 9, py = y + 16, fc = closed(f.id);
            const gate = f.id === gateId, isFoc = f.id === focusId, isCheck = modeOfTrigger(f) === "check";
            const pc = STATE.arenaColoring ? ARENA_META[arenaOfTrigger(f)].color : col;
            const foc = isFoc ? `<circle cx="${px}" cy="${py}" r="5.5" fill="none" stroke="${GOLD}" stroke-width="1.6"/>` : "";
            const tt = `<title>${gate ? '★ ключевое · ' : ''}${MODE_META[modeOfTrigger(f)].icon} ${instrumentLabel(f)} · ${ARENA_META[arenaOfTrigger(f)].icon} ${ARENA_META[arenaOfTrigger(f)].label} · ${esc(f.title)} → «${MEANS[lvl].name}» М${m}${fc ? ' · закрыто' : ''}</title>`;
            const sw = gate ? 1.7 : 1;
            const shape = isCheck
              ? `<rect x="${px - (gate ? 3 : 2.4)}" y="${py - (gate ? 3 : 2.4)}" width="${(gate ? 3 : 2.4) * 2}" height="${(gate ? 3 : 2.4) * 2}" rx="0.6" fill="${fc ? pc : 'none'}" stroke="${pc}" stroke-width="${sw}" opacity="${fc ? 0.95 : 0.5}" style="cursor:pointer" onclick="actClick('${f.id}')">${tt}</rect>`
              : `<circle cx="${px}" cy="${py}" r="${gate ? 3 : 2.4}" fill="${fc ? pc : 'none'}" stroke="${pc}" stroke-width="${sw}" opacity="${fc ? 0.95 : 0.5}" style="cursor:pointer" onclick="actClick('${f.id}')">${tt}</circle>`;
            return `${foc}${shape}`;
          }).join("");
        };
        return `
          ${conn}
          ${node('dist', laneY.dist)}${node('real', laneY.real)}${node('conf', laneY.conf)}
          ${pipRow('dist', laneY.dist)}${pipRow('real', laneY.real)}${pipRow('conf', laneY.conf)}
          <text x="${x}" y="${laneY.dist - 34}" text-anchor="middle" fill="${mastered ? GOLD : '#5a6478'}" font-size="${mastered ? 10 : 9}" font-weight="700">${mastered ? '◆ освоено' : k + '/3'}</text>
          <text x="${x}" y="${laneY.conf + 40}" text-anchor="middle" fill="${m === focusM ? GOLD : (mastered ? GOLD : '#8590a8')}" font-size="9" font-weight="700">М${m}</text>
          <text x="${x}" y="${laneY.conf + 52}" text-anchor="middle" fill="#5a6478" font-size="8">${esc(it.short)}</text>
        `;
      }).join("")}

      <!-- След освоения: докуда прорисован путь активностями (без подтверждения) -->
      ${engaged && (!frontier || engaged.day > frontier.day) ? `
        <line x1="${dayX(engaged.day)}" y1="66" x2="${dayX(engaged.day)}" y2="${laneY.conf + 20}" stroke="#5a6478" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.8"/>
        <text x="${dayX(engaged.day)}" y="${laneY.conf + 64}" text-anchor="middle" fill="#5a6478" font-size="9">прорисовано активностями</text>
      ` : ''}

      <!-- Подтверждённый рубеж: появляется ТОЛЬКО если закрыт подтверждающий артефакт -->
      ${frontier ? `
        <line x1="${dayX(frontier.day)}" y1="60" x2="${dayX(frontier.day)}" y2="${laneY.conf + 24}" stroke="#34d399" stroke-width="2" stroke-dasharray="6,4"/>
        <g transform="translate(${dayX(frontier.day)}, 50)">
          <rect x="-78" y="-13" width="156" height="20" rx="10" fill="#0d1f17" stroke="#34d399" stroke-width="1"/>
          <text x="0" y="1" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">✓ подтверждено · М${frontier.module} (${esc(instrumentLabel(frontier))})</text>
        </g>` : ''}
    </svg>`;

  // --- Карточки средств: 3 уровня, под каждым — ВСЕ активности, что на него влияют ---
  const meanCard = (it) => {
    const m = it.m, tr = triadOf(m), mastered = masteredOf(m);
    const k = ['dist', 'real', 'conf'].filter(l => lvlClosed(m, l)).length;
    const isFocusCard = m === focusM;
    const onlyTodo = STATE.meansOnlyTodo;
    const actRow = (a, gateId, mm) => {
      const c = closed(a.id), gate = a.id === gateId, foc = a.id === focusId;
      return `<div onclick="actClick('${a.id}')" title="${MODE_META[modeOfTrigger(a)].label}: ${instrumentLabel(a)}${gate ? ' · ключевое' : ''} · клик: подсветить на карте${constructMode ? ' / отметить' : ''}" style="display:flex; gap:7px; align-items:flex-start; padding:3px 5px; border-radius:6px; cursor:pointer; background:${foc ? GOLD + '22' : (gate ? mm.color + '14' : 'transparent')}; ${foc ? `outline:1px solid ${GOLD};` : ''}">
        <span style="font-size:11px; color:${c ? mm.color : '#3a4358'}; line-height:1.4;">${c ? '●' : '○'}</span>
        <span style="flex:1; min-width:0; font-size:11px; color:${c ? 'var(--text)' : 'var(--text-dim)'}; line-height:1.35;">${gate ? '★ ' : ''}${esc(a.title)}</span>
        <span style="white-space:nowrap; font-size:9px; color:var(--text-muted); border:1px solid var(--border); border-radius:100px; padding:1px 6px;">${instrumentLabel(a)}</span>
      </div>`;
    };
    const subGroup = (mode, acts, gateId, mm) => {
      let list = acts.filter(a => modeOfTrigger(a) === mode);
      if (onlyTodo) list = list.filter(a => !closed(a.id) && a.day <= currentGlobalDay);
      if (!list.length) return "";
      const md = MODE_META[mode];
      return `<div style="margin-top:6px;">
        <div style="font-size:9px; font-weight:800; letter-spacing:0.04em; color:${md.color}; margin-bottom:2px;">${md.icon} ${md.label.toUpperCase()}</div>
        <div style="display:flex; flex-direction:column; gap:3px;">${list.map(a => actRow(a, gateId, mm)).join("")}</div>
      </div>`;
    };
    const levelBlock = (lvl) => {
      const mm = MEANS[lvl], gateId = tr[lvl], lc = lvlClosed(m, lvl);
      const acts = feedersOf(m, lvl);
      const done = acts.filter(a => closed(a.id)).length;
      const frac = acts.length ? Math.round(done / acts.length * 100) : 0;
      const learn = subGroup("learn", acts, gateId, mm), check = subGroup("check", acts, gateId, mm);
      const body = (learn + check) || `<div style="font-size:10px; color:var(--text-muted); padding:4px 2px;">${onlyTodo ? 'нет активных задач до сегодня' : '—'}</div>`;
      return `<div style="border:1px solid ${lc ? mm.color + '55' : 'var(--border)'}; border-radius:9px; padding:9px 10px; background:${lc ? mm.color + '0d' : 'transparent'};">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
          <span style="font-size:11px; font-weight:800; color:${mm.color};">${mm.icon} ${mm.name}</span>
          <span style="font-size:10px; font-weight:700; color:${lc ? mm.color : 'var(--text-muted)'};">${lc ? '✓ сошлось' : done + '/' + acts.length}</span>
        </div>
        <div style="height:4px; background:var(--bg); border-radius:100px; overflow:hidden;"><div style="height:100%; width:${frac}%; background:${mm.color}; transition:width 0.4s;"></div></div>
        ${body}
      </div>`;
    };
    return `<div class="card" style="padding:15px; border:1px solid ${isFocusCard ? GOLD : (mastered ? GOLD : 'var(--border)')}; ${(mastered || isFocusCard) ? `box-shadow:0 0 0 1px ${GOLD}33;` : ''}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:12px;">
        <div><div style="font-size:10px; color:var(--text-muted); font-weight:700;">СРЕДСТВО · М${m}</div><div style="font-weight:700; font-size:13px; line-height:1.3;">${esc(it.name)}</div></div>
        <span style="white-space:nowrap; font-size:11px; font-weight:800; padding:3px 9px; border-radius:100px; background:${mastered ? GOLD : 'var(--bg)'}; color:${mastered ? '#0a0e1a' : 'var(--text-muted)'}; border:1px solid ${mastered ? GOLD : 'var(--border)'};">${mastered ? '◆ ОСВОЕНО' : 'в процессе ' + k + '/3'}</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${levelBlock('dist')}${levelBlock('real')}${levelBlock('conf')}
      </div>
    </div>`;
  };

  return `
    <div class="topline">
      <div class="breadcrumb">Моя траектория · освоение средств</div>
      <div class="user-info"><span>${esc(STATE.user.company)}</span><div class="user-avatar">${esc(initials(STATE.user.name))}</div></div>
    </div>

    <h1>🧭 Конструктор средств</h1>
    <p class="lead">
      Каждое средство — это способность по отношению к предмету. Принцип:
      <b>средство освоено только когда сошлись все три уровня</b> —
      участник его и <span style="color:#6b8aff; font-weight:600;">различает</span>,
      и <span style="color:#f59e0b; font-weight:600;">реализует</span>,
      и <span style="color:#34d399; font-weight:600;">уверен в результате</span>.
      Траектория показывает, какие действия закрыть, чтобы каждое средство сложилось целиком.
    </p>

    ${renderTrajModeToggle()}
    ${STATE.simMode ? renderSimPanel() : ''}
    ${constructMode ? `<div style="margin:12px 0 4px; padding:11px 14px; background:rgba(107,138,255,0.08); border:1px solid rgba(107,138,255,0.3); border-radius:8px; font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span>🧱 <b>Конструктор.</b> Кликайте по активностям — уровень сходится по доле закрытых, а средство «освоено» зажигается золотым, когда сошлись все три уровня. Клик ещё и подсвечивает на карте, на что влияет действие. Старт — с чистого листа.</span>
      <button onclick="resetConstruct()" class="traj-replay-btn" style="margin-left:auto;">↺ Очистить</button>
    </div>` : ''}

    <div class="card" style="margin:14px 0; padding:18px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div style="font-weight:800; font-size:14px;">Освоено средств</div>
        <div style="font-family:ui-monospace,Menlo,monospace; font-size:24px; font-weight:800; color:${masteredCount >= 6 ? GOLD : masteredCount >= 3 ? '#f59e0b' : 'var(--text-dim)'};">${masteredCount} / 9</div>
      </div>
      <div style="height:9px; background:var(--bg); border-radius:100px; overflow:hidden; margin-bottom:14px;"><div style="height:100%; width:${Math.round(masteredCount / 9 * 100)}%; background:linear-gradient(90deg,#6b8aff,#f59e0b,#34d399); transition:width 0.5s;"></div></div>
      <div style="display:flex; gap:18px; flex-wrap:wrap; font-size:12px;">
        <span style="color:#6b8aff; font-weight:600;">👁 различаю: ${lvlCount('dist')}/9</span>
        <span style="color:#f59e0b; font-weight:600;">🛠 реализую: ${lvlCount('real')}/9</span>
        <span style="color:#34d399; font-weight:600;">✓ уверен: ${lvlCount('conf')}/9</span>
        <span style="color:var(--text-muted);">активностей закрыто: ${TRIGGERS.filter(t => closed(t.id)).length}/${TRIGGERS.length}</span>
        <span style="color:var(--text-muted); margin-left:auto;">уровень сходится по доле активностей; средство — когда сошлись все три</span>
      </div>
    </div>

    <div class="card" style="margin:14px 0; padding:18px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <div style="font-weight:800; font-size:14px;">Профиль вклада · по аренам</div>
        <button class="traj-replay-btn" onclick="navigate('profile')">Открыть «Мой профиль» →</button>
      </div>
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Где участник проявляется по жизни программы. Взвешенно: подтверждающие действия весят ×3, осваивающие ×1.</div>
      <div style="display:flex; gap:24px; align-items:center; flex-wrap:wrap;">
        <div style="flex:0 0 auto;">${arenaRadarSVG(activeFired, { size: 200 })}</div>
        <div style="flex:1; min-width:220px;">${arenaBars(activeFired)}</div>
      </div>
    </div>

    <h2 style="margin-top:24px;">Карта освоения средств</h2>
    <p style="color:var(--text-dim); font-size:13px; margin-bottom:12px;">
      Каждое средство — <b>вертикальная триада</b> на трёх уровнях. Узел — <b>кольцо прогресса</b>: заполняется по доле закрытых активностей уровня; полное кольцо = уровень <b>сошёлся</b>. <b>Мелкие точки под узлом</b> — все активности, что на уровень работают (★ — ключевое). Связка становится <span style="color:${GOLD}; font-weight:700;">золотой «◆ освоено»</span>, когда сошлись все три. Клик по любой активности — <b>подсветит её средство и уровень</b>.<br>
      Позиция на траектории определяется <b>не календарём, а делом</b>: <span style="color:#5a6478; font-weight:700;">серый пунктир</span> — докуда путь прорисован активностями (регистрация, премодуль, глоссарий, ИИ-тьютор, обучающие упражнения), <span style="color:#34d399; font-weight:700;">зелёный рубеж «✓ подтверждено»</span> появляется только когда закрыто подтверждающее действие (квиз, задача, артефакт, защита).
    </p>

    ${focusT ? (() => {
      const fMode = modeOfTrigger(focusT), isGate = focusId === triadOf(focusM)[focusLvl];
      const vitok = (isGate && focusM < 9) ? ` Собери все три уровня — откроется виток к средству М${focusM + 1}.` : '';
      return `<div class="card" style="margin-bottom:12px; padding:11px 14px; border:1px solid ${GOLD}; background:${GOLD}14; display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:13px;">
      <span style="flex:1; min-width:240px;">🔍 <span style="color:${MODE_META[fMode].color}; font-weight:700;">${MODE_META[fMode].icon} ${MODE_META[fMode].label}</span> <span style="font-size:11px; color:var(--text-muted);">(${instrumentLabel(focusT)})</span> · <b>${esc(focusT.title)}</b><br>
        → ${fMode === 'check' ? 'подтверждает' : 'осваивает'} уровень <span style="color:${MEANS[focusLvl].color}; font-weight:700;">${MEANS[focusLvl].icon} ${MEANS[focusLvl].name}</span> средства <b>М${focusM} · ${esc(MEANS_ITEMS.find(i => i.m === focusM).name)}</b>${isGate ? ' · <b>★ ключевое</b>' : ''}.${vitok}</span>
      <span style="margin-left:auto; display:flex; gap:8px;">
        <button onclick="showTriggerModal('${focusId}')" class="traj-replay-btn">Подробнее</button>
        <button onclick="clearFocus()" class="traj-replay-btn">✕ Сбросить</button>
      </span>
    </div>`; })() : ''}

    <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
      <button class="traj-replay-btn" onclick="STATE._shownDeps=null; renderContent()">▶ Проиграть сборку</button>
      <label style="display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim); cursor:pointer;">
        <input type="checkbox" ${STATE.meansOnlyTodo ? 'checked' : ''} onchange="STATE.meansOnlyTodo=this.checked; renderContent()" style="cursor:pointer;">
        Только то, что нужно закрыть (до сегодня)
      </label>
      <div style="display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; font-size:12px;">
        <button onclick="STATE.arenaColoring=false; renderContent()" style="border:none; cursor:pointer; padding:6px 11px; background:${!STATE.arenaColoring ? 'var(--gradient)' : 'transparent'}; color:${!STATE.arenaColoring ? '#fff' : 'var(--text-dim)'}; font-weight:600;">по уровню</button>
        <button onclick="STATE.arenaColoring=true; renderContent()" style="border:none; cursor:pointer; padding:6px 11px; background:${STATE.arenaColoring ? 'var(--gradient)' : 'transparent'}; color:${STATE.arenaColoring ? '#fff' : 'var(--text-dim)'}; font-weight:600;">по арене</button>
      </div>
      <span style="display:flex; align-items:center; gap:14px; margin-left:auto; font-size:11px; color:var(--text-muted);">
        ${STATE.arenaColoring
          ? ARENA_ORDER.map(ar => `<span style="display:flex; align-items:center; gap:5px;"><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="${ARENA_META[ar].color}"/></svg>${ARENA_META[ar].icon} ${ARENA_META[ar].label}</span>`).join("")
          : `<span style="display:flex; align-items:center; gap:5px;"><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="none" stroke="#8b9dff" stroke-width="1.4"/></svg>📚 осваиваю</span>
             <span style="display:flex; align-items:center; gap:5px;"><svg width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="#34d399" stroke-width="1.4"/></svg>✅ подтверждаю</span>`}
        <span>○ открыто · ● закрыто · ★ ключевое</span>
      </span>
    </div>

    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:20px; overflow-x:auto; margin-bottom:18px;">
      ${svg}
    </div>

    <div class="grid-2" style="gap:14px; margin-bottom:26px;">
      ${["learn", "check"].map(md => `<div class="card" style="padding:14px; border-left:3px solid ${MODE_META[md].color};">
        <div style="font-weight:800; font-size:13px; color:${MODE_META[md].color}; margin-bottom:4px;">${MODE_META[md].icon} ${MODE_META[md].label}</div>
        <div style="font-size:12px; color:var(--text-dim); line-height:1.45;">${MODE_META[md].hint}.${md === 'check' ? ' Именно подтверждающее действие (★ ключевое) засчитывает уровень — «средство есть».' : ' Эти активности формируют способность, но сами по себе её не доказывают.'}</div>
      </div>`).join("")}
    </div>

    <h2>Что на что влияет</h2>
    <p style="color:var(--text-dim); font-size:13px; margin-bottom:14px;">
      Под каждым уровнем средства активности разделены на <span style="color:#8b9dff; font-weight:700;">📚 Осваиваю</span> (лекции, кейсы, дискуссии) и <span style="color:#34d399; font-weight:700;">✅ Подтверждаю</span> (квизы, задачи, защиты). <span style="font-weight:700;">★ ключевое</span> подтверждающее действие засчитывает уровень. Клик по активности — <b>подсветит её средство и уровень на карте</b>${constructMode ? ' и отметит выполненной' : ''}.
    </p>
    <div class="grid-3" style="gap:16px; margin-bottom:36px;">
      ${MEANS_ITEMS.map(meanCard).join("")}
    </div>
  `;
}

/* ============================================================
   TRAJECTORY VIEW — 4 траектории + зависимости + триггеры (legacy)
   ============================================================ */

function renderTrajectory() {
  // Какой набор «сработавших» триггеров показываем (режимы Факт / Конструктор / Смоделировать)
  const constructMode = STATE.constructMode;
  const simOn = !constructMode && STATE.simMode && STATE.simResult;
  const activeFired = constructMode ? STATE.constructFired : (simOn ? STATE.simResult.fired : STATE.firedTriggers);

  // Текущая позиция слушателя
  const currentGlobalDay = (STATE.currentModule - 1) * 4 + STATE.currentDay;
  const totalDays = 36;
  const currentPercent = (currentGlobalDay / totalDays) * 100;

  // Эпистемические станции — повторяются 9 раз
  const epStations = ["Методология", "Кейсы", "Упражнения", "Применение", "Рефлексия", "Стек"];

  // Социальные стадии — 6 стадий с распределением по дням
  const socStages = [
    { name: "Знакомство", dayStart: 1, dayEnd: 1, desc: "Установка Дня 1 М1, формирование peer-троек" },
    { name: "Peer-тройка", dayStart: 2, dayEnd: 12, desc: "Доверие в малой группе через 2-3 недели синков" },
    { name: "Когорта", dayStart: 12, dayEnd: 20, desc: "Идентичность Потока 001 через М3-М4" },
    { name: "Индустрия", dayStart: 5, dayEnd: 32, desc: "Гостевые CAIO, защиты — связи с действующими директорами" },
    { name: "Партнёры", dayStart: 32, dayEnd: 36, desc: "Финальная защита перед панелью CAIO внешних компаний" },
    { name: "Alumni", dayStart: 36, dayEnd: 36, desc: "Alumni-сеть на годы вперёд (пожизненно)" }
  ];

  // 9 разделов финальной Программы платформы и их прогресс к каждому модулю
  const constructSections = [
    { num: 1, name: "Стратегический контекст", readyAfterModule: 1 },
    { num: 2, name: "Карта процессов", readyAfterModule: 3 },
    { num: 3, name: "Архитектура платформы", readyAfterModule: 2 },
    { num: 4, name: "МЗ-компонент", readyAfterModule: 3 },
    { num: 5, name: "Команда", readyAfterModule: 6 },
    { num: 6, name: "Unit-экономика", readyAfterModule: 5 },
    { num: 7, name: "Регуляторика+Security", readyAfterModule: 7 },
    { num: 8, name: "AgentOps", readyAfterModule: 8 },
    { num: 9, name: "Дорожная карта", readyAfterModule: 9 }
  ];
  // Сколько секций готово к текущему модулю
  const sectionsReady = constructSections.filter(s => s.readyAfterModule <= STATE.currentModule - 1).length;
  const sectionsPartial = constructSections.filter(s => s.readyAfterModule === STATE.currentModule).length;
  const constructPercent = Math.round(((sectionsReady + sectionsPartial * 0.5) / 9) * 100);

  // Статистика триггеров
  const triggerStats = getTriggerStats(activeFired);
  const totalFired = activeFired.size;
  const totalTriggers = TRIGGERS.length;
  const firedPercent = Math.round((totalFired / totalTriggers) * 100);

  // Группировка триггеров по траекториям
  const triggersByTraj = { ep: [], con: [], co: [], soc: [] };
  TRIGGERS.forEach(t => triggersByTraj[t.traj].push(t));
  Object.keys(triggersByTraj).forEach(k => triggersByTraj[k].sort((a, b) => a.day - b.day));

  // Ключевые зависимости между траекториями (общий источник — TRAJ_DEPS).
  // Стрелка видна только если её триггер-источник закрыт (activeFired).
  const deps = TRAJ_DEPS;
  const depVisible = d => activeFired.has(d.fromTrigger);
  // Какие связи были видны на прошлом рендере — чтобы анимировать «прорисовку» только новым.
  const prevShownDeps = STATE._shownDeps instanceof Set ? STATE._shownDeps : new Set();
  const curShownDeps = new Set();
  deps.forEach((d, i) => { if (depVisible(d)) curShownDeps.add(i); });
  STATE._shownDeps = curShownDeps;

  // Координаты — 36 дней на ширину 1100px (используем viewBox)
  const W = 1100;
  const dayX = day => 50 + (day - 1) * ((W - 100) / 35);
  const cy = (track) => ({ ep: 90, con: 215, co: 340, soc: 455 }[track] || 90);
  // Задержка анимации построения по дню (схема «строится» слева направо за ~2.6с)
  const ANIM_SPAN = 2.6;
  const dly = day => ((Math.max(1, Math.min(36, day)) - 1 ) / 35 * ANIM_SPAN).toFixed(2);

  // SVG для связей
  function depPath(from, to) {
    const x1 = dayX(from.day), y1 = cy(from.track);
    const x2 = dayX(to.day), y2 = cy(to.track);
    const mx = (x1 + x2) / 2;
    return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  }
  const depColor = (type) => ({ enables: "#34d399", feeds: "#6b8aff", requires: "#f59e0b", leads: "#a78bfa" }[type] || "#8590a8");

  return `
    <div class="topline">
      <div class="breadcrumb">Моя траектория · 4 оси движения</div>
      <div class="user-info">
        <span>${esc(STATE.user.company)}</span>
        <div class="user-avatar">${esc(initials(STATE.user.name))}</div>
      </div>
    </div>

    <h1>🧭 Моя траектория · 4 оси одновременно</h1>
    <p class="lead">
      Вы движетесь по программе сразу по четырём осям в разных ритмах. Текущая позиция — День ${currentGlobalDay} из 36.
    </p>

    ${renderTrajModeToggle()}
    ${STATE.simMode ? renderSimPanel() : ''}
    ${constructMode ? `<div style="margin:12px 0 4px; padding:11px 14px; background:rgba(107,138,255,0.08); border:1px solid rgba(107,138,255,0.3); border-radius:8px; font-size:13px; color:var(--text-dim); display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span>🧱 <b>Конструктор.</b> Кликайте по триггерам на схеме или в списке ниже, чтобы отметить их выполненными — стрелки-зависимости будут прорисовываться по мере закрытия источников. Старт — с чистого листа.</span>
      <button onclick="resetConstruct()" class="traj-replay-btn" style="margin-left:auto;">↺ Очистить</button>
    </div>` : ''}

    <div class="dash-stats">
      <div class="dash-stat"><div class="num">${STATE.currentModule}/9</div><div class="label">модуль (содержание)</div></div>
      <div class="dash-stat"><div class="num">${STATE.currentModule}/9</div><div class="label">циклов эпистемики</div></div>
      <div class="dash-stat"><div class="num">${simOn ? STATE.simResult.projectPercent : constructPercent}%</div><div class="label">${simOn ? 'проект собран (прогноз)' : 'проект собран'}</div></div>
      <div class="dash-stat"><div class="num">${totalFired}/${totalTriggers}</div><div class="label">${simOn ? 'триггеров сработает' : 'триггеров сработало'}</div></div>
    </div>

    ${simOn ? renderSimResult(STATE.simResult) : ''}

    <h2 style="margin-top: 32px;">Визуализация всех четырёх траекторий</h2>
    <p style="color: var(--text-dim); font-size: 13px; margin-bottom: 16px;">
      Четыре горизонтальные дорожки — четыре траектории; ось снизу — дни программы (1–36).
      Стрелки-зависимости <b>появляются не сразу</b>: каждая прорисовывается, когда вы закрываете её активность-источник (в режиме «Смоделировать» — когда включаете нужные активности).
      Оранжевая пунктирная линия — где вы сейчас. Наведите курсор на любую точку, чтобы увидеть детали.
    </p>

    <div style="margin-bottom: 12px;">
      <button class="traj-replay-btn" onclick="STATE._shownDeps=null; renderContent()">▶ Проиграть построение</button>
      <span style="color: var(--text-muted); font-size: 12px; margin-left: 10px;">Дорожки проявляются по времени слева направо, стрелки показывают, что от чего зависит.</span>
    </div>
    ${simOn ? `<div style="margin-bottom: 12px; padding: 9px 12px; background: rgba(167, 139, 250, 0.08); border: 1px solid rgba(167, 139, 250, 0.3); border-radius: 8px; font-size: 12px; color: var(--text-dim);">
      🧪 <b>Режим прогноза.</b> Пунктирная полоса над каждой дорожкой — прогнозируемый охват оси по вашим параметрам (% и докуда «дотянется» к финалу). Зажжённые точки = триггеры, которые сработают; <span style="color:#f87171; font-weight:600;">красные стрелки</span> — связи под угрозой из-за проседающей оси-источника.
    </div>` : ''}

    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; overflow-x: auto; margin-bottom: 16px;">
      <svg viewBox="0 0 ${W} 510" xmlns="http://www.w3.org/2000/svg" style="width: 100%; min-width: 900px; height: 510px;">

        <defs>
          <marker id="arrow-enables" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#34d399"/></marker>
          <marker id="arrow-feeds" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b8aff"/></marker>
          <marker id="arrow-requires" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/></marker>
          <marker id="arrow-leads" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/></marker>
          <marker id="arrow-risk" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker>
        </defs>

        <!-- Фоновые полосы дорожек -->
        <g>
          ${[['ep', 90, '#6b8aff'], ['con', 215, '#34d399'], ['co', 340, '#f59e0b'], ['soc', 455, '#a78bfa']].map(([k, yy, col]) => `
            <rect x="12" y="${yy - 34}" width="${W - 24}" height="68" rx="10" fill="${col}" opacity="0.04"/>
            <rect x="12" y="${yy - 34}" width="3" height="68" rx="2" fill="${col}" opacity="0.6"/>
          `).join('')}
        </g>

        <!-- Сетка по границам модулей -->
        <g>
          ${[4,8,12,16,20,24,28,32,36].map(d => `<line x1="${dayX(d)}" y1="56" x2="${dayX(d)}" y2="472" stroke="#1f2740" stroke-width="1" opacity="0.5"/>`).join('')}
        </g>

        <!-- Подложки треков -->
        <g>
          <!-- ЭПИСТЕМИКА -->
          <text x="20" y="50" fill="#e4e8f1" font-size="13" font-weight="700">ЭПИСТЕМИКА</text>
          <text x="20" y="65" fill="#8590a8" font-size="10">9 циклов × 6 станций</text>
          <line x1="50" y1="90" x2="${W - 50}" y2="90" stroke="#1f2740" stroke-width="2"/>
          <text x="50" y="120" fill="#5a6478" font-size="9">Станции цикла: ${epStations.join(' · ')}</text>

          ${MODULES.map((m, i) => {
            const x1 = dayX(m.num * 4 - 3);
            const x2 = dayX(m.num * 4);
            const xmid = (x1 + x2) / 2;
            return `
              <rect x="${x1 - 8}" y="78" width="${x2 - x1 + 16}" height="24" fill="rgba(107, 138, 255, 0.05)" rx="4"/>
              <text x="${xmid}" y="96" text-anchor="middle" fill="#6b8aff" font-size="9" font-weight="600">М${m.num} цикл</text>
            `;
          }).join('')}

          ${[1,2,3,4,5,6,7,8,9].flatMap(modNum => {
            return epStations.map((st, idx) => {
              const dayInMod = Math.min(5, Math.ceil((idx + 1) / 1.2));
              const globalDay = (modNum - 1) * 4 + dayInMod;
              const isCompleted = globalDay < currentGlobalDay;
              const isCurrent = modNum === STATE.currentModule;
              const cx = dayX((modNum - 1) * 4 + (idx + 1) * 4 / 6);
              const r = isCurrent ? 4 : 3;
              return `<circle class="traj-node" style="animation-delay:${dly(globalDay)}s" cx="${cx}" cy="90" r="${r}" fill="${isCompleted ? '#34d399' : (isCurrent ? '#6b8aff' : '#3a4358')}"><title>${esc(st)} · М${modNum} (день ${globalDay})</title></circle>`;
            }).join('');
          }).join('')}
        </g>

        <!-- СОДЕРЖАНИЕ -->
        <g>
          <text x="20" y="170" fill="#e4e8f1" font-size="13" font-weight="700">СОДЕРЖАНИЕ</text>
          <text x="20" y="185" fill="#8590a8" font-size="10">9 модулей × 4 дня</text>
          ${MODULES.map((m, i) => {
            const x1 = dayX(m.num * 4 - 3);
            const x2 = dayX(m.num * 4);
            const xmid = (x1 + x2) / 2;
            const isCurrent = m.num === STATE.currentModule;
            const isDone = m.num < STATE.currentModule;
            const fill = isDone ? "rgba(52, 211, 153, 0.15)" : (isCurrent ? "rgba(107, 138, 255, 0.2)" : "rgba(60, 70, 90, 0.3)");
            const stroke = isDone ? "#34d399" : (isCurrent ? "#6b8aff" : "#1f2740");
            return `
              <rect class="traj-node" style="animation-delay:${dly(m.num * 4 - 3)}s" x="${x1 - 6}" y="200" width="${x2 - x1 + 12}" height="30" fill="${fill}" stroke="${stroke}" stroke-width="1.5" rx="4"/>
              <text x="${xmid}" y="219" text-anchor="middle" fill="${isDone ? '#34d399' : (isCurrent ? '#6b8aff' : '#8590a8')}" font-size="11" font-weight="700">М${m.num}</text>
            `;
          }).join('')}
        </g>

        <!-- КОНСТРУКТИВ -->
        <g>
          <text x="20" y="295" fill="#e4e8f1" font-size="13" font-weight="700">КОНСТРУКТИВ</text>
          <text x="20" y="310" fill="#8590a8" font-size="10">9 разделов Программы платформы</text>
          ${(() => {
            const groups = {};
            constructSections.forEach(s => { (groups[s.readyAfterModule] = groups[s.readyAfterModule] || []).push(s.num); });
            return constructSections.map((s) => {
              const x = dayX(s.readyAfterModule * 4);
              const grp = groups[s.readyAfterModule];
              const idx = grp.indexOf(s.num);
              const yc = 340 + (idx - (grp.length - 1) / 2) * 14;
              const isReady = STATE.currentModule >= s.readyAfterModule;
              const isWorking = STATE.currentModule === s.readyAfterModule;
              const col = isReady ? '#34d399' : '#3a4358';
              return `
              <circle class="traj-node" style="animation-delay:${dly(s.readyAfterModule * 4)}s" cx="${x}" cy="${yc}" r="${isWorking ? 6 : 4}" fill="${col}"><title>§${s.num} ${esc(s.name)} · готов после М${s.readyAfterModule}</title></circle>
              <text x="${x + 8}" y="${yc + 3}" text-anchor="start" fill="${isReady ? '#34d399' : '#5a6478'}" font-size="9" font-weight="600">§${s.num}</text>
            `;
            }).join('');
          })()}
        </g>

        <!-- СОЦИАЛЬНАЯ -->
        <g>
          <text x="20" y="420" fill="#e4e8f1" font-size="13" font-weight="700">СОЦИАЛЬНАЯ</text>
          <text x="20" y="435" fill="#8590a8" font-size="10">6 стадий капитала</text>
          ${socStages.map((s, i) => {
            const x1 = dayX(s.dayStart);
            const x2 = dayX(s.dayEnd);
            const xmid = (x1 + x2) / 2;
            const isActive = currentGlobalDay >= s.dayStart;
            const isCurrent = currentGlobalDay >= s.dayStart && currentGlobalDay <= s.dayEnd;
            return `
              <line class="traj-node" style="animation-delay:${dly(s.dayStart)}s" x1="${x1}" y1="455" x2="${x2}" y2="455" stroke="${isActive ? '#a78bfa' : '#3a4358'}" stroke-width="3" stroke-linecap="round"/>
              <circle class="traj-node" style="animation-delay:${dly(s.dayStart)}s" cx="${x1}" cy="455" r="${isCurrent ? 5 : 4}" fill="${isActive ? '#a78bfa' : '#3a4358'}"/>
              <text x="${x1}" y="472" fill="${isActive ? '#a78bfa' : '#5a6478'}" font-size="10" font-weight="600">${esc(s.name)}</text>
            `;
          }).join('')}
        </g>

        <!-- Зависимости: прорисовываются по мере закрытия активностей-источников -->
        ${STATE.showDeps !== false ? deps.map((d, i) => {
          if (!depVisible(d)) return '';   // источник ещё не закрыт — стрелки нет
          const x1 = dayX(d.from.day), y1 = cy(d.from.track);
          const x2 = dayX(d.to.day), y2 = cy(d.to.track);
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          const risky = simOn && STATE.simResult.axisBalance[d.from.track] < 55;
          const col = risky ? '#f87171' : depColor(d.type);
          const label = (risky ? '⚠ ' : '') + `${d.from.label} → ${d.to.label}`;
          const lw = label.length * 5.3 + 14;
          const marker = risky ? 'arrow-risk' : ('arrow-' + d.type);
          const isNew = !prevShownDeps.has(i);   // анимируем «прорисовку» только новым
          const dd = (parseFloat(dly(d.from.day)) + 0.15).toFixed(2);
          const pathCls = isNew ? 'traj-dep' : 'traj-dep-flow';
          const pathStyle = isNew ? ` style="animation-delay:${dd}s, ${dd}s"` : '';
          const tracer = isNew ? `<path class="traj-dep-trace" style="animation-delay:${dd}s, ${dd}s" pathLength="1" d="${depPath(d.from, d.to)}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/>` : '';
          const dotAttr = isNew ? `class="traj-node" style="animation-delay:${dd}s"` : '';
          const lblAttr = isNew ? `class="traj-dep-label" style="animation-delay:${dd}s"` : '';
          return `
          <path class="${pathCls}"${pathStyle} d="${depPath(d.from, d.to)}" fill="none" stroke="${col}" stroke-width="${risky ? 2 : 1.5}" stroke-dasharray="4,3" opacity="${risky ? 0.95 : 0.7}" marker-end="url(#${marker})"><title>${esc(label)} · ${d.type}</title></path>
          ${tracer}
          <circle ${dotAttr} cx="${x1}" cy="${y1}" r="3" fill="${col}"/>
          <g ${lblAttr} transform="translate(${mx}, ${my})">
            <rect x="${-lw / 2}" y="-8" width="${lw}" height="16" rx="8" fill="#0d1220" stroke="${col}" stroke-width="0.8" opacity="0.92"/>
            <text x="0" y="3.5" text-anchor="middle" fill="${col}" font-size="8.5" font-weight="600">${esc(label)}</text>
          </g>
        `;}).join('') : ''}

        <!-- Триггеры — маркеры рядом с треками -->

          const trigY = { ep: 75, con: 195, co: 325, soc: 440 };

            const isFired = activeFired.has(t.id);
            const x = dayX(t.day);
            const y = trigY[t.traj];
            const color = TRAJECTORY_LABELS[t.traj].color;
            const hint = constructMode ? (isFired ? ' — клик: снять' : ' — клик: отметить') : (isFired ? ' — сработал' : ' — ожидает');
            if (isFired) {
              return `<g class="traj-node" style="cursor: pointer; animation-delay:${dly(t.day)}s" onclick="${clk(t.id)}">
                <circle cx="${x}" cy="${y}" r="5.5" fill="${color}" stroke="#0a0e1a" stroke-width="1.5"/>
                <circle cx="${x}" cy="${y}" r="2.5" fill="#fff"/>
                <title>${esc(t.title)}${hint}</title>
              </g>`;
            } else {
              return `<g class="traj-node" style="cursor: pointer; animation-delay:${dly(t.day)}s" opacity="0.55" onclick="${clk(t.id)}">
                <circle cx="${x}" cy="${y}" r="3.5" fill="none" stroke="${color}" stroke-width="1.3" stroke-dasharray="2,1.5"/>
                <title>${esc(t.title)}${hint}</title>
              </g>`;
            }
          }).join('');
        })()}

        <!-- План-оверлей: прогнозируемый охват по каждой оси (только в режиме «Смоделировать») -->
        ${simOn ? `<g>
          ${[['ep', 90], ['con', 215], ['co', 340], ['soc', 455]].map(([k, laneY]) => {
            const pct = STATE.simResult.axisBalance[k];

            return `
              <line x1="${dayX(1)}" y1="${yy}" x2="${fx}" y2="${yy}" stroke="${col}" stroke-width="2.5" stroke-dasharray="7,4" opacity="0.9"/>

              <text x="${fx + 6}" y="${yy + 3.5}" fill="${col}" font-size="9" font-weight="700">${pct}%</text>
            `;
          }).join('')}
        </g>` : ''}

        <!-- Сканирующая линия построения (сметает слева направо при загрузке/повторе) -->
        <line class="traj-scan" x1="${dayX(1)}" y1="56" x2="${dayX(1)}" y2="486" stroke="#6b8aff" stroke-width="2">

/* ============================================================
   NAVIGATION
   ============================================================ */

function navigate(view, moduleNum) {
  STATE.view = view;
  if (moduleNum) STATE.currentModule = moduleNum;
  if (view !== 'module') STATE.expandedDay = null;
  if (view === 'module' && moduleNum === 1) STATE.expandedDay = STATE.currentDay;  // auto-expand current day
  render();
  window.scrollTo(0, 0);
}

function toggleDay(day) {
  STATE.expandedDay = STATE.expandedDay === day ? null : day;
  renderContent();
}

/* ============================================================
   RENDER
   ============================================================ */

function renderContent() {
  let content;
  if (STATE.view === 'dashboard') content = renderDashboard();
  else if (STATE.view === 'path') content = renderPath();
  else if (STATE.view === 'module') content = renderModule(STATE.currentModule);
  else if (STATE.view === 'calendar') content = renderCalendar();
  else if (STATE.view === 'tools') content = renderTools();
  else if (STATE.view === 'library') content = renderLibrary();
  else if (STATE.view === 'agents') content = renderAgents();
  else if (STATE.view === 'practices') content = renderPractices();
  else if (STATE.view === 'personal-stack') content = renderPersonalStack();
  else if (STATE.view === 'plan-map') content = renderPlanMap();
  else if (STATE.view === 'trajectory') content = renderMeans();
  else if (STATE.view === 'profile') content = renderProfile();
  else content = renderDashboard();

  document.getElementById('content').innerHTML = content;
  if (STATE.view === 'dashboard') scrollTutorInline();
}

function render() {
  renderSidebar();
  renderContent();
}

/* ============================================================
   ПЕРСИСТЕНТНОСТЬ + ОНБОРДИНГ + ДИАГНОСТИКА (режим диагностики, без бэкенда)
   ============================================================ */

const STORE_KEY = 'aimba_portal_v1';
const MATURITY_KEY = 'aimba_maturity_v1';

function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '—';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1,
      onboarded: !!STATE.onboarded,
      user: STATE.user,
      firedTriggers: Array.from(STATE.firedTriggers),
      currentDay: STATE.currentDay,
      currentModule: STATE.currentModule,
      quizM1: STATE.quizM1 || null,
      maturity: STATE.maturity || null,
      personalStack: STATE.personalStack || null,
      tutorLog: STATE.tutorLog || [],
      hubExpandedModule: STATE.hubExpandedModule || null
    }));
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    STATE.onboarded = !!d.onboarded;
    if (d.user) STATE.user = d.user;
    if (Array.isArray(d.firedTriggers)) STATE.firedTriggers = new Set(d.firedTriggers);
    if (d.currentDay) STATE.currentDay = d.currentDay;
    if (d.currentModule) STATE.currentModule = d.currentModule;
    STATE.quizM1 = d.quizM1 || null;
    STATE.maturity = d.maturity || null;
    if (d.personalStack) STATE.personalStack = d.personalStack;
    if (Array.isArray(d.tutorLog)) STATE.tutorLog = d.tutorLog;
    if (d.hubExpandedModule) STATE.hubExpandedModule = d.hubExpandedModule;
    if (d.personalRoute) STATE.personalRoute = d.personalRoute;
    return true;
  } catch (e) { return false; }
}

function resetProgress() {
  if (!confirm('Сбросить весь прогресс и начать заново? Это действие нельзя отменить.')) return;
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(MATURITY_KEY); } catch (e) {}
  location.href = location.pathname;
}

function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

/* --- Подхват результата AI Maturity из общего хранилища --- */
function syncMaturity() {
  try {
    const raw = localStorage.getItem(MATURITY_KEY);
    if (!raw) return false;
    const m = JSON.parse(raw);
    if (m && m.completedAt) {
      const changed = !STATE.maturity || STATE.maturity.completedAt !== m.completedAt;
      STATE.maturity = m;
      STATE.firedTriggers.add('diag.in.M1');
      maybeCompleteDiagnostic();
      if (changed) saveState();
      return changed;
    }
  } catch (e) {}
  return false;
}

/* --- Входной квиз понятий Модуля 1 --- */
const QUIZ_M1 = [
  { q: 'Что главное отличает «агентную компанию» от компании, просто использующей ИИ?',
    options: ['В ней больше сотрудников знают про ИИ', 'Её бизнес-модель и операции невозможны без автономных агентов', 'Она купила корпоративную лицензию на чат-бота', 'У неё есть отдел аналитики данных'], correct: 1 },
  { q: 'Главная интеллектуальная формула программы:',
    options: ['Данные → дашборды → отчёты → решения', 'Машина Знаний → агентная платформа → KPT → AgentOps', 'Облако → API → микросервисы → SaaS', 'Стратегия → бюджет → найм → запуск'], correct: 1 },
  { q: 'Кого выращивает программа?',
    options: ['Дата-сайентистов', 'Промпт-инженеров', 'Директоров по ИИ (CAIO), строящих агентную платформу компании', 'Менеджеров проектов'], correct: 2 },
  { q: 'Что описывает шкала AI Maturity L0–L5?',
    options: ['Размер ИИ-бюджета в рублях', 'Зрелость — от индивидуального использования GenAI до agent-augmented enterprise', 'Количество моделей в проде', 'Уровень зарплат ИИ-команды'], correct: 1 },
  { q: 'Принцип «AgentOps по умолчанию» означает, что каждый агент:',
    options: ['Запускается без тестов, чтобы быстрее', 'Имеет эвалы, observability, кост-трекинг и kill-switch с самого начала', 'Работает только в выходные', 'Управляется вручную оператором'], correct: 1 },
  { q: 'Структура программы:',
    options: ['12 модулей по 3 дня за полгода', '9 модулей по 4 дня, разнесённых на 9 месяцев', '6 модулей по неделе за 2 месяца', '1 интенсив на 36 дней подряд'], correct: 1 }
];
STATE.quizDraft = {};

function startQuizM1() {
  STATE.quizDraft = {};
  renderQuizModal();
}

function renderQuizModal() {
  const total = QUIZ_M1.length;
  const answered = Object.keys(STATE.quizDraft).length;
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <div style="margin-top:4px;">
      <div style="font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:#06b6d4; font-weight:700; margin-bottom:6px;">DIAG · Входной квиз Модуля 1</div>
      <h2 style="margin:0 0 4px;">Понятия Модуля 1</h2>
      <p style="color:var(--text-dim); font-size:13px; margin-bottom:18px;">${total} вопросов · отвечено ${answered}/${total}. Это baseline — отвечайте как понимаете сейчас.</p>
      <div style="display:flex; flex-direction:column; gap:18px;">
        ${QUIZ_M1.map((item, qi) => `
          <div>
            <div style="font-weight:600; margin-bottom:10px; line-height:1.45;">${qi + 1}. ${esc(item.q)}</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${item.options.map((opt, oi) => {
                const sel = STATE.quizDraft[qi] === oi;
                return `<div onclick="pickQuiz(${qi}, ${oi})" style="cursor:pointer; padding:10px 14px; border-radius:9px; border:1px solid ${sel ? 'var(--accent)' : 'var(--border)'}; background:${sel ? 'rgba(107,138,255,0.12)' : 'var(--bg-sidebar)'}; font-size:13px; line-height:1.4;">${esc(opt)}</div>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:22px; padding-top:18px; border-top:1px solid var(--border);">
        <button onclick="submitQuizM1()" ${answered < total ? 'disabled' : ''}
          style="width:100%; padding:12px 20px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:${answered < total ? 'not-allowed' : 'pointer'}; background:${answered < total ? 'rgba(107,138,255,0.25)' : 'var(--gradient)'}; color:#fff; opacity:${answered < total ? 0.6 : 1};">
          ${answered < total ? `Ответьте на все вопросы (${answered}/${total})` : 'Завершить квиз →'}
        </button>
      </div>
    </div>
  `);
}

function pickQuiz(qi, oi) {
  STATE.quizDraft[qi] = oi;
  renderQuizModal();
}

function submitQuizM1() {
  if (Object.keys(STATE.quizDraft).length < QUIZ_M1.length) return;
  let correct = 0;
  QUIZ_M1.forEach((item, qi) => { if (STATE.quizDraft[qi] === item.correct) correct++; });
  STATE.quizM1 = { completedAt: new Date().toISOString(), correct: correct, total: QUIZ_M1.length };
  STATE.firedTriggers.add('m1.glossary');
  maybeCompleteDiagnostic();
  saveState();
  closeModal();
  render();
  alert(`Квиз завершён: ${correct} из ${QUIZ_M1.length} верных. Это ваш входной baseline — на выходе из модуля сравним.`);
}

/* --- Завершение входной диагностики М1 --- */
function diagnosticDone() {
  return !!(STATE.maturity && STATE.maturity.completedAt) && !!(STATE.quizM1 && STATE.quizM1.completedAt);
}

function maybeCompleteDiagnostic() {
  if (diagnosticDone()) {
    STATE.firedTriggers.add('diag.in.M1');
    STATE.firedTriggers.add('con.start');
  }
}

  const both = mDone && qDone;
  const stepRow = (done, icon, title, desc, btn) => `

      <div style="font-size:22px; width:28px; text-align:center;">${done ? '✅' : icon}</div>
      <div style="flex:1;">
        <div style="font-weight:600; margin-bottom:3px;">${title}</div>
        <div style="font-size:13px; color:var(--text-dim); line-height:1.45;">${desc}</div>
      </div>
      <div style="flex-shrink:0;">${btn}</div>
    </div>`;
  const btnStyle = (primary) => `text-decoration:none; display:inline-block; padding:9px 16px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; border:1px solid ${primary ? 'transparent' : 'var(--border)'}; background:${primary ? 'var(--gradient)' : 'transparent'}; color:${primary ? '#fff' : 'var(--text)'};`;

  const maturityBtn = mDone
    ? `<span style="font-size:13px; color:var(--accent-green, #34d399); font-weight:600;">L${STATE.maturity.overallLevel}</span> <a href="../tools/maturity/?from=portal" style="${btnStyle(false)}">Пройти заново</a>`
    : `<a href="../tools/maturity/?from=portal" style="${btnStyle(true)}">Пройти →</a>`;
  const quizBtn = qDone
    ? `<span style="font-size:13px; color:var(--accent-green, #34d399); font-weight:600;">${STATE.quizM1.correct}/${STATE.quizM1.total}</span> <button onclick="startQuizM1()" style="${btnStyle(false)}">Заново</button>`
    : `<button onclick="startQuizM1()" style="${btnStyle(true)}">Пройти →</button>`;

  return `
    <div style="background:linear-gradient(135deg, rgba(107,138,255,0.10), rgba(167,139,250,0.06)); border:1px solid rgba(107,138,255,0.3); border-radius:16px; padding:24px 26px; margin:20px 0 28px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
        <span style="font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:#06b6d4; font-weight:700;">Входная диагностика · Модуль 1</span>
        ${both ? '<span style="margin-left:auto; font-size:12px; color:#34d399; font-weight:600;">✓ Завершена</span>' : '<span style="margin-left:auto; font-size:12px; color:#f59e0b; font-weight:600;">Выполните оба шага</span>'}
      </div>
      <h2 style="margin:0 0 6px; font-size:20px;">${both ? 'Диагностика пройдена — baseline зафиксирован' : 'Начните с входной диагностики'}</h2>
      <p style="color:var(--text-dim); font-size:14px; line-height:1.5; margin-bottom:14px;">
        ${both
          ? 'Ваш стартовый уровень зафиксирован. На выходе из модуля сравним дельту. Можно выгрузить результат и прислать координатору программы.'
          : 'Два шага дают измеримый baseline вашей компании и понимания: оценка зрелости и квиз понятий. Без этого нечем измерять рост.'}
      </p>
      ${stepRow(mDone, '📊', 'AI Maturity Self-Assessment', '6 измерений · 18 вопросов · уровень L0–L5 и радар-профиль', maturityBtn)}
      ${stepRow(qDone, '📝', 'Входной квиз понятий', '6 вопросов по ключевым понятиям Модуля 1', quizBtn)}
      ${both ? `<div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
        <button onclick="exportDiagnostic()" style="${btnStyle(false)}">⬇ Выгрузить результат</button>
        <button onclick="navigate('module', 1)" style="${btnStyle(true)}">Дальше: открыть Модуль 1 →</button>
      </div>` : ''}
    </div>`;
}

/* --- Экспорт результата диагностики --- */
function exportDiagnostic() {
  const payload = {
    участник: STATE.user.name,
    компания: STATE.user.company,
    поток: 'Поток 001 · Пилотный',
    дата_выгрузки: new Date().toISOString(),
    входная_диагностика_M1: {
      ai_maturity: STATE.maturity || null,
      квиз_понятий: STATE.quizM1 || null
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safe = (STATE.user.name || 'участник').replace(/[^a-zа-яё0-9]+/gi, '_');
  a.href = url; a.download = `AI_MBA_диагностика_${safe}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================================================
   ИИ-ТЬЮТОР (контекстный помощник пилота, без бэкенда)
   ============================================================ */
STATE.tutorLog = [];

function tutorReadinessReport() {
  const prestart = PRESTART_ITEMS.filter(i => i.done()).length;
  const modReady = moduleReadiness(STATE.currentModule);
  const project = projectSectionsDone();
  let verdict = "Старт возможен — закройте оставшиеся пункты чеклиста.";
  if (prestart < 2) verdict = "Рано в М1 — сначала входная диагностика (baseline обязателен).";
  else if (prestart >= 4) verdict = "Хорошая готовность — можно углубляться в модуль и пилот.";
  const items = PRESTART_ITEMS.map(i => `${i.done() ? "✅" : "○"} ${i.label}`).join("<br>");
  const mDone = !!(STATE.maturity && STATE.maturity.completedAt);
  const lvl = mDone ? `L${STATE.maturity.overallLevel}` : "не оценён";
  return `<strong>Оценка готовности</strong><br><br>
    • Чеклист старта: <strong>${prestart}/${PRESTART_ITEMS.length}</strong><br>
    • Зрелость компании: <strong>${lvl}</strong><br>
    • Готовность текущего модуля (М${STATE.currentModule}): <strong>${modReady}%</strong><br>
    • Проектный трек: <strong>${project}/9</strong> разделов<br><br>
    ${items}<br><br>
    <em>${verdict}</em>`;
}

function tutorPreStudy() {
  const mDone = !!(STATE.maturity && STATE.maturity.completedAt);
  const list = [
    "<strong>Обязательно до Д1:</strong> входная диагностика (AI Maturity + квиз понятий)",
    "<strong>Желательно:</strong> премодульный глоссарий М1 — термины агентной платформы, KPT, AgentOps",
    "<strong>На Д1:</strong> личный стек ИИ-лидера (6 компонентов) + public commitment",
    "<strong>Сквозное:</strong> начать worksheet «Моя компания» §1 — стратегический контекст вашей компании",
    "<strong>Социальное:</strong> познакомиться с peer-тройкой — блок «Сообщество»"
  ];
  if (mDone && STATE.maturity.topGaps && STATE.maturity.topGaps.length) {
    const g = STATE.maturity.topGaps.slice(0, 2).map(x => x.name).join(", ");
    list.push(`<strong>По вашим разрывам (${g}):</strong> сфокусируйте первые упражнения М1 на этих измерениях`);
  }
  return "Что изучить перед стартом:<br><br>" + list.map((l, i) => `${i + 1}. ${l}`).join("<br>");
}

function tutorProgramOverview() {
  return `Программа — <strong>9 модулей × 4 дня</strong>, разнесённых на 9 месяцев.<br><br>
    <strong>Формула:</strong> Машина Знаний → агентная платформа → KPT → AgentOps.<br><br>
    <strong>Карта программы</strong> (выше) — все модули с готовностью. Кликните модуль — увидите артефакты и % по осям «понимаю / уверен / строю».<br><br>
    <strong>Проектный трек</strong> — сквозной пилот: каждый модуль добавляет раздел в финальную «Программу построения агентной платформы». К М9 — документ + работающий пилот 3–5 агентов.<br><br>
    Сейчас вы на <strong>Дне ${(STATE.currentModule - 1) * 4 + STATE.currentDay}</strong> программы.`;
}

function tutorProjectTrackExplain() {
  return `Проектный трек — это не отдельный курс, а <strong>сборка одного артефакта</strong> из 9 разделов:<br><br>
    1) Worksheet «Моя компания» — живой черновик<br>
    2) Пилот — работающие агенты, MCP, eval-наборы<br>
    3) Программа платформы — защитимый документ для совета директоров<br><br>
    Схема выше показывает, какой модуль кормит какой раздел (§1–§9). Зелёные — уже закрытые триггеры в портале. Кликните раздел — перейдёте в соответствующий модуль.`;
}

function tutorNextStep() {
  const mDone = !!(STATE.maturity && STATE.maturity.completedAt);
  const qDone = !!(STATE.quizM1 && STATE.quizM1.completedAt);
  if (!mDone && !qDone) {
    return 'Сейчас ваш шаг — <strong>входная диагностика Модуля 1</strong>. Справа от меня: 1) <em>AI Maturity</em> и 2) <em>квиз понятий</em>. Без baseline нельзя измерить рост.';
  }
  if (mDone && !qDone) {
    return 'Оценку зрелости вы прошли. Остался <strong>входной квиз понятий</strong> — 5 минут, кнопка «Пройти» справа.';
  }
  if (!mDone && qDone) {
    return 'Квиз пройден. Остался <strong>AI Maturity Self-Assessment</strong> — кнопка «Пройти» справа.';
  }
  const lvl = STATE.maturity.overallLevel;
  const gaps = (STATE.maturity.topGaps || []).map(g => g.name).join(', ');
  return `Диагностика завершена — уровень <strong>L${lvl}</strong>, разрывы: <strong>${esc(gaps || '—')}</strong>.<br><br>
    1) Кликните <strong>М${STATE.currentModule}</strong> на карте программы — проверьте готовность<br>
    2) Откройте расписание текущего дня<br>
    3) Заполните worksheet §1 и смотрите проектный трек — какой раздел пилота следующий<br>
    4) Познакомьтесь с peer-тройкой в блоке «Сообщество»`;
}

function tutorAnswer(text) {
  const t = (text || '').toLowerCase();
  const has = (...arr) => arr.some(w => t.includes(w));

  if (has('что делать', 'что дальше', 'дальше', 'с чего начать', 'начать', 'next', 'делать'))
    return tutorNextStep();
  if (has('готовност', 'оцени', 'готов'))
    return tutorReadinessReport();
  if (has('изучить', 'подготов', 'перед старт', 'премодул', 'до старт'))
    return tutorPreStudy();
  if (has('устроен', 'структур', 'как программ', '9 модул', 'карта программ'))
    return tutorProgramOverview();
  if (has('проектн', 'трек', 'пилот', 'раздел', 'программа платформ', 'worksheet'))
    return tutorProjectTrackExplain();
  if (has('сообществ', 'сокурсник', 'alumni', 'выпускник', 'сколково', 'mba', 'emba'))
    return `В блоке <strong>«Сообщество»</strong> ниже — ваша peer-тройка (${COHORT.size} слушателей в потоке) и экосистема Сколково: <strong>${COHORT.alumni.total}</strong> выпускников (MBA ${COHORT.alumni.mba}, EMBA ${COHORT.alumni.emba}, цифровые программы ${COHORT.alumni.digital}). После выпуска — alumni-каталог и менторство.`;
  if (has('kpt', 'кпт'))
    return 'KPT — ключевая метрика программы: пропускная способность производства знания процессом (сколько решений/единиц знания процесс производит за единицу времени и стоимости). В программе вы считаете <strong>baseline и целевой KPT</strong> и декомпозируете его по этапам процесса. Это связывает Машину Знаний с экономикой платформы.';
  if (has('l0', 'l5', 'уровн', 'maturity', 'зрелост'))
    return 'AI Maturity Index — шкала зрелости из 6 уровней: <strong>L0</strong> (ИИ как личная инициатива) → <strong>L1–L2</strong> (отдельные инициативы и стратегия для одной функции) → <strong>L3</strong> (корпоративная ИИ-стратегия) → <strong>L4</strong> (бизнес частично основан на ИИ) → <strong>L5</strong> (agent-augmented enterprise: бизнес-модель невозможна без агентов). Диагностика оценивает вас по 6 измерениям: стратегия, данные, технологии, люди, процессы, культура.';
  if (has('агентн', 'компани'))
    return 'Агентная компания — это не та, что «использует ИИ», а та, чьи <strong>бизнес-модель и операции невозможны без автономных агентов</strong>. Программа учит строить такую агентную производственную платформу и готовит директоров (CAIO), которые ею управляют.';
  if (has('квиз', 'тест'))
    return 'Входной квиз — 6 вопросов по понятиям Модуля 1 (агентная компания, формула программы, уровни зрелости, AgentOps). Это <em>baseline</em>. Кнопка «Пройти» — справа в блоке диагностики.';
  if (has('worksheet', 'моя компания', 'артефакт'))
    return 'Worksheet «Моя компания» — сквозной артефакт программы. Вы наполняете его от модуля к модулю: стратегический контекст, карта процессов с KPT, архитектура платформы и т.д. К финалу из него собирается защитимая «Программа платформы». Загляните в раздел «Библиотека».';
  if (has('калибров', 'прогноз', 'brier'))
    return 'Калибровка прогнозов — сквозная практика на все 9 месяцев. Вы делаете датируемые прогнозы и считаете Brier score, тренируя честную оценку уверенности. Это главная эпистемологическая дисциплина программы.';
  if (has('peer', 'тройк', 'группа'))
    return 'Peer-тройка — ваша группа из 3 слушателей с еженедельным синком по понедельникам (check-in / блокер / отчёт). Это переход от формальной группы к рабочей: туда выносят реальные блокеры компании.';
  if (has('тьютор', 'agent', 'агент', 'помощ'))
    return 'Я — <strong>тьютор онбординга</strong>: оцениваю готовность, объясняю карту программы и проектный трек. Спросите «оцени мою готовность» или «что изучить перед стартом». Полноценный разговорный ИИ подключится на Этапе 2.';

  // фолбэк
  return `Пока я отвечаю на типовые вопросы пилота и подсказываю следующий шаг. По вашему прогрессу:<br><br>${tutorNextStep()}<br><br><span style="color:var(--text-muted); font-size:12px;">Полноценный разговорный ИИ-тьютор появится с платформой программы (Этап 2).</span>`;
}

function openTutor() {
  if (!STATE.tutorLog.length) {
    const name = (STATE.user.name || '').split(' ')[0] || 'коллега';
    STATE.tutorLog.push({ role: 'tutor', html: `Здравствуйте, ${esc(name)}! Я ваш Personal Tutor. Спросите меня «что мне делать дальше?» или о понятиях программы.<br><br>${tutorNextStep()}` });
  }
  renderTutor();
}

function renderTutor() {
  const chips = ['Что мне делать дальше?', 'Что такое KPT?', 'Объясни уровни L0–L5', 'Что такое агентная компания?', 'Что такое worksheet «Моя компания»?'];
  const msgs = STATE.tutorLog.map(m => {
    if (m.role === 'user') {
      return `<div style="align-self:flex-end; max-width:85%; background:var(--accent); color:#fff; padding:10px 14px; border-radius:14px 14px 4px 14px; font-size:14px; line-height:1.5;">${esc(m.html)}</div>`;
    }
    return `<div style="align-self:flex-start; max-width:90%; background:var(--bg-sidebar); border:1px solid var(--border); color:var(--text); padding:11px 15px; border-radius:14px 14px 14px 4px; font-size:14px; line-height:1.55;"><span style="font-size:13px;">🤖</span> ${m.html}</div>`;
  }).join('');

  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <div style="margin-top:2px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
        <span style="font-size:22px;">🤖</span>
        <div>
          <div style="font-weight:700; font-size:17px;">Personal Tutor</div>
          <div style="font-size:11px; color:var(--text-muted);">Пилотный помощник · подсказывает по вашему прогрессу</div>
        </div>
      </div>
      <div id="tutor-msgs" style="display:flex; flex-direction:column; gap:10px; margin:16px 0; max-height:46vh; overflow-y:auto; padding-right:4px;">
        ${msgs}
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;">
        ${chips.map(c => `<button onclick="tutorAsk('${c.replace(/'/g, "\\'")}')" style="padding:7px 11px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:12px; cursor:pointer;">${esc(c)}</button>`).join('')}
      </div>
      <div style="display:flex; gap:8px;">
        <input id="tutor-input" type="text" placeholder="Спросите тьютора…" onkeydown="if(event.key==='Enter')tutorSend()"
          style="flex:1; padding:11px 14px; background:var(--bg-sidebar); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px;">
        <button onclick="tutorSend()" style="padding:11px 18px; border:none; border-radius:10px; background:var(--gradient); color:#fff; font-weight:600; cursor:pointer;">→</button>
      </div>
    </div>
  `);
  setTimeout(() => {
    const box = document.getElementById('tutor-msgs');
    if (box) box.scrollTop = box.scrollHeight;
    const inp = document.getElementById('tutor-input');
    if (inp) inp.focus();
  }, 40);
}

function scrollTutorInline() {
  setTimeout(() => {
    const box = document.getElementById('tutor-msgs-inline');
    if (box) box.scrollTop = box.scrollHeight;
  }, 30);
}

function tutorAsk(text) {
  const q = (text || '').trim();
  if (!q) return;
  if (!STATE.tutorLog) STATE.tutorLog = [];
  STATE.tutorLog.push({ role: 'user', html: q });
  STATE.tutorLog.push({ role: 'tutor', html: tutorAnswer(q) });
  STATE.firedTriggers.add('m1.tutor');
  saveState();
  if (STATE.view === 'dashboard') renderContent();
  else renderTutor();
}

function tutorSendInline() {
  const inp = document.getElementById('tutor-input-inline');
  if (!inp) return;
  const v = inp.value;
  inp.value = '';
  tutorAsk(v);
}

function tutorSend() {
  const inp = document.getElementById('tutor-input');
  if (!inp) return;
  const v = inp.value;
  inp.value = '';
  tutorAsk(v);
}

/* --- Загрузка приложения --- */
function boot() {
  const bootParams = new URLSearchParams(location.search);
  const bootView = bootParams.get('view');
  const bootMod = parseInt(bootParams.get('n') || '0', 10);
  const had = loadState();
  if (!had) {
    STATE.firedTriggers = new Set();
    STATE.currentDay = 1;
    STATE.currentModule = 1;
    STATE.user = { name: '', company: '' };
    STATE.onboarded = false;
  }
  if (typeof PathStore !== 'undefined') {
    PathStore.syncToPortal();
    loadState();
  }
  syncMaturity();
  ensurePersonalStack();
  if (location.search) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  render();
  if (bootView) navigate(bootView, bootMod || undefined);
  if (!STATE.onboarded) showOnboarding();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

boot();
</script>
