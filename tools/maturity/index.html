<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Maturity Self-Assessment v2026 · AI MBA</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #10120f;
    --bg-card: #151713;
    --bg-card-hover: #1c1e19;
    --border: #38372f;
    --text: #eee9df;
    --text-dim: #aaa69c;
    --text-muted: #77746b;
    --accent: #d0aa58;
    --accent-2: #e1c47f;
    --accent-warm: #f59e0b;
    --accent-green: #34d399;
    --accent-red: #f87171;
    --gradient: linear-gradient(135deg, #bd9347 0%, #e2c57f 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    background:
      linear-gradient(rgba(208,170,88,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(208,170,88,.025) 1px, transparent 1px),
      var(--bg);
    background-size: 48px 48px;
    color: var(--text);
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .container { max-width: 980px; margin: 0 auto; padding: 32px 24px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(16, 18, 15, 0.92);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-weight: 700; font-size: 16px;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .badge-version {
    font-size: 12px; color: var(--text-dim);
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 100px;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px;
    border-radius: 2px;
    font-weight: 600; font-size: 15px;
    cursor: pointer;
    border: none; font-family: inherit;
    transition: all 0.2s;
    color: inherit;
  }
  .btn-primary {
    background: var(--gradient); color: white;
    box-shadow: none;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(208,170,88,.16); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .welcome { text-align: center; padding: 60px 24px; }
  .welcome .badge {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(107, 138, 255, 0.1);
    border: 1px solid rgba(107, 138, 255, 0.3);
    border-radius: 100px;
    color: var(--accent);
    font-size: 13px; font-weight: 500; margin-bottom: 24px;
  }
  .welcome h1 {
    font-size: 48px; line-height: 1.1; letter-spacing: -0.02em;
    margin-bottom: 20px; font-weight: 700;
  }
  .welcome h1 .accent {
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .welcome p.sub { font-size: 19px; color: var(--text-dim); max-width: 640px; margin: 0 auto 40px; }
  .info-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    max-width: 800px; margin: 0 auto 40px;
  }
  .info-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; text-align: left;
  }
  .info-card .num { font-size: 28px; font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 6px;
  }
  .info-card .label { font-size: 13px; color: var(--text-dim); }

  .progress-wrapper { margin-bottom: 32px; }
  .progress-info {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 14px; color: var(--text-dim);
  }
  .progress-track {
    height: 6px; background: var(--bg-card); border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--gradient); transition: width 0.3s;
  }

  .dimension-header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 8px;
  }
  .dimension-icon { font-size: 32px; }
  .dimension-name { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .dimension-counter { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }

  .question-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 17px; font-weight: 600; margin-bottom: 18px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .option:hover { background: var(--bg-card-hover); border-color: rgba(107, 138, 255, 0.4); }
  .option.selected {
    background: rgba(107, 138, 255, 0.08);
    border-color: var(--accent);
  }
  .option-marker {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .option.selected .option-marker {
    background: var(--gradient); color: white; border-color: transparent;
  }
  .option-text { flex: 1; font-size: 14px; line-height: 1.5; color: var(--text); }

  .nav-buttons {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 32px;
  }

  .results-header {
    text-align: center; padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .overall-level {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 24px;
    background: rgba(107, 138, 255, 0.08);
    border: 1px solid rgba(107, 138, 255, 0.3);
    border-radius: 100px;
    margin-bottom: 24px;
  }
  .overall-level .label { font-size: 13px; color: var(--text-dim); }
  .overall-level .level {
    font-size: 18px; font-weight: 700;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .results-header h2 {
    font-size: 36px; line-height: 1.2; margin-bottom: 12px;
  }
  .results-header p { color: var(--text-dim); font-size: 16px; max-width: 580px; margin: 0 auto; }

  .results-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    margin-bottom: 32px;
  }
  .panel {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px;
  }
  .panel h3 {
    font-size: 18px; font-weight: 600; margin-bottom: 4px;
  }
  .panel .panel-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

  .radar-container {
    display: flex; justify-content: center; align-items: center;
    min-height: 320px;
  }
  .radar-svg { width: 100%; max-width: 380px; height: auto; }

  .dim-scores { display: flex; flex-direction: column; gap: 12px; }
  .dim-score-row {
    display: flex; align-items: center; gap: 12px;
  }
  .dim-score-name { flex: 1; font-size: 14px; }
  .dim-score-bar-wrapper {
    flex: 2; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden;
  }
  .dim-score-bar { height: 100%; background: var(--gradient); transition: width 0.5s; }
  .dim-score-value {
    font-size: 13px; font-weight: 600; color: var(--accent); min-width: 32px; text-align: right;
  }

  .gaps-list { display: flex; flex-direction: column; gap: 16px; }
  .gap-item {
    padding: 16px;
    background: var(--bg); border-radius: 10px;
    border-left: 3px solid var(--accent-warm);
  }
  .gap-name {
    font-weight: 600; font-size: 15px;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .gap-current {
    font-size: 12px; color: var(--accent-warm);
    padding: 2px 8px; background: rgba(245, 158, 11, 0.1);
    border-radius: 100px;
  }
  .gap-rec { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  .recommendations {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px;
    margin-bottom: 32px;
  }
  .recommendations h3 { font-size: 20px; margin-bottom: 8px; }
  .recommendations .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .rec-card {
    padding: 18px;
    background: var(--bg); border-radius: 10px;
    margin-bottom: 12px;
    border-left: 3px solid var(--accent);
  }
  .rec-title { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
  .rec-body { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

  .results-actions {
    display: flex; justify-content: center; gap: 12px;
    margin-top: 40px;
  }

  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .eyebrow { color:var(--accent); font:600 12px/1.4 var(--mono); letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px; }
  .meta-line, .status-line { color:var(--text-dim); font-size:14px; margin:12px 0 28px; }
  progress { width:100%; height:8px; accent-color:var(--accent); }
  .question-card fieldset, fieldset.question-card { border:0; min-width:0; }
  .question-card legend { width:100%; }
  .option { position:relative; min-height:52px; }
  .option input:focus-visible + label { outline:2px solid var(--accent); outline-offset:3px; }
  .option label { display:flex; align-items:flex-start; gap:14px; width:100%; cursor:pointer; }
  .option.unknown { margin-top:10px; border-style:dashed; }
  .question-error { color:#f0a69a; font-size:13px; margin-top:10px; }
  .checkpoint { max-width:760px; margin:70px auto; }
  .checkpoint-grid, .module-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin:24px 0; }
  .value-card, .module-card, .cta-band, .recovery-card { padding:24px; background:var(--bg-card); border:1px solid var(--border); }
  .value-card strong, .module-card strong { display:block; margin-bottom:8px; }
  .confidence { display:inline-flex; padding:8px 12px; border:1px solid var(--border); color:var(--text-dim); font-size:13px; margin-top:16px; }
  .score-table { width:100%; border-collapse:collapse; margin-top:16px; font-size:14px; }
  .score-table th,.score-table td { padding:10px; border-bottom:1px solid var(--border); text-align:left; }
  .tie-options { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px; }
  .tie-option { display:flex; gap:10px; padding:14px; border:1px solid var(--border); min-height:44px; }
  .tie-controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px; }
  .tie-count { color:var(--text-dim); font-size:13px; margin-right:auto; }
  .tie-message { color:#f0a69a; font-size:13px; width:100%; min-height:18px; }
  .module-card .artifact { color:var(--text-dim); font-size:14px; line-height:1.5; margin:12px 0; }
  .cta-band { margin:32px 0; display:flex; justify-content:space-between; align-items:center; gap:24px; border-color:var(--accent); }
  .cta-actions { display:flex; flex-wrap:wrap; gap:10px; }
  details.rec-card summary { cursor:pointer; font-weight:600; }
  details.rec-card .rec-body { margin-top:12px; }
  .topbar { gap:18px; }
  .topbar a { color:var(--text-dim); text-decoration:none; }

  .level-reference {
    margin-top: 60px; padding: 28px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 16px;
  }
  .level-reference h4 { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
  .level-list {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .level-row {
    padding: 12px 14px;
    background: var(--bg); border-radius: 8px;
    font-size: 13px;
  }
  .level-row .lvl { font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .level-row .lvl-desc { color: var(--text-dim); }

  footer {
    margin-top: 60px; padding: 24px 0;
    text-align: center; color: var(--text-muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer .meta { margin-bottom: 4px; }

  @media (max-width: 768px) {
    .container { padding-left:16px; padding-right:16px; }
    .topbar { flex-wrap:wrap; padding:14px 16px; }
    .welcome h1 { font-size: 32px; }
    .info-grid { grid-template-columns: 1fr; }
    .results-grid { grid-template-columns: 1fr; }
    .level-list { grid-template-columns: 1fr; }
    .dimension-name { font-size: 22px; }
    .checkpoint-grid,.module-grid,.tie-options { grid-template-columns:1fr; }
    .nav-buttons,.results-actions,.cta-band,.cta-actions { flex-direction:column; align-items:stretch; }
    .nav-buttons .btn,.results-actions .btn,.cta-actions .btn { width:100%; }
    .option { min-height:44px; }
  }
  @media print {
    :root { --bg:#fff; --bg-card:#fff; --text:#111; --text-dim:#333; --border:#bbb; }
    body { background:#fff!important; color:#111!important; }
    .topbar,footer,.results-actions,.cta-band,.btn { display:none!important; }
    .container { max-width:none; padding:0; }
    .panel,.gap-item,.module-card,.rec-card,.level-reference { break-inside:avoid; box-shadow:none!important; }
    .results-grid { grid-template-columns:1fr 1fr; }
    .radar-svg text { fill:#111; }
  }
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div id="app"></div>

<script>

/* ============================================================
   HELPERS
   ============================================================ */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function getTotalQuestions() {
  return DIMENSIONS.reduce((sum, d) => sum + d.questions.length, 0);
}

function getAnsweredCount() {
  return Object.keys(state.answers).length;
}

function getDimensionScores() {
  return DIMENSIONS.map(dim => {
    const values = dim.questions.map(q => state.answers[q.id]).filter(Number.isFinite);
    const avg = values.length >= 2 ? values.reduce((a,b) => a+b,0) / values.length : null;
    return {
      id: dim.id,
      name: dim.name,
      icon: dim.icon,
      score: avg === null ? null : Math.round(avg * 10) / 10,
      roundedScore: avg === null ? null : Math.round(avg),
      answeredCount: values.length
    };
  });
}

function getOverallLevel() {
  const scores = getDimensionScores();
  const usable = scores.filter(d => d.score !== null);
  if (!usable.length) return null;
  return Math.round(usable.reduce((s,d) => s+d.score,0) / usable.length);
}

function isDimensionComplete(dimIdx) {
  const dim = DIMENSIONS[dimIdx];
  return dim.questions.every(q => Object.prototype.hasOwnProperty.call(state.answers,q.id));
}

function getConfidence() {
  const count = Object.values(state.answers).filter(Number.isFinite).length;
  return { count, label: count >= 16 ? 'высокая' : count >= 12 ? 'средняя' : 'низкая' };
}

function track(name, props={}) {
  try { window.umami?.track(name,props); window.dataLayer?.push({event:name,...props}); window.dispatchEvent(new CustomEvent('aimba:analytics',{detail:{name,...props}})); } catch (_) {}
}

function safeStorageSet(key,value) { try { localStorage.setItem(key,value); return true; } catch (_) { state.storageWarning='Не удалось сохранить данные в браузере. Не закрывайте эту вкладку.'; return false; } }
function safeStorageRemove(key) { try { localStorage.removeItem(key); return true; } catch (_) { return false; } }

function saveDraft() {
  return safeStorageSet(DRAFT_KEY, JSON.stringify({schemaVersion:2,assessmentVersion:ASSESSMENT_VERSION,updatedAt:new Date().toISOString(),source:state.source,currentDim:state.currentDim,screen:state.screen,answers:state.answers,priorityGaps:state.priorityGaps}));
}

function loadDraft() {
  try {
    const draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (!draft || draft.schemaVersion !== 2 || Date.now()-Date.parse(draft.updatedAt) > 30*864e5 || !draft.answers || typeof draft.answers !== 'object') return null;
    const questionIds=new Set(DIMENSIONS.flatMap(d=>d.questions.map(q=>q.id))), dimensionIds=new Set(DIMENSIONS.map(d=>d.id));
    if(!Number.isInteger(draft.currentDim)||draft.currentDim<0||draft.currentDim>=DIMENSIONS.length) return null;
    if(!['welcome','wizard','checkpoint','results'].includes(draft.screen)) return null;
    if(!['landing','portal','direct'].includes(draft.source)) draft.source='direct';
    if(Object.entries(draft.answers).some(([id,value])=>!questionIds.has(id)||(value!==null&&(!Number.isInteger(value)||value<0||value>5)))) return null;
    if(!Array.isArray(draft.priorityGaps)||draft.priorityGaps.some(id=>!dimensionIds.has(id))) draft.priorityGaps=[];
    return draft;
  } catch (_) { safeStorageRemove(DRAFT_KEY); return null; }
}

/* ============================================================
   SVG RADAR CHART
   ============================================================ */

function renderRadarChart(scores) {
  const size = 380;
  const cx = size / 2;
  const cy = size / 2;
  const R = 130;
  const angles = scores.map((_, i) => -Math.PI / 2 + (i * 2 * Math.PI) / scores.length);

  // Grid: 5 concentric polygons
  let gridSvg = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const r = (lvl / 5) * R;
    const points = angles.map(a => {
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      return `${x},${y}`;
    }).join(' ');
    gridSvg += `<polygon points="${points}" fill="none" stroke="#1f2740" stroke-width="1"/>`;
  }

  // Axes
  let axesSvg = '';
  angles.forEach((a, i) => {
    const x2 = cx + R * Math.cos(a);
    const y2 = cy + R * Math.sin(a);
    axesSvg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#1f2740" stroke-width="1"/>`;
  });

  // Data polygon
  const dataPoints = scores.map((s, i) => {
    const r = ((s.score ?? 0) / 5) * R;
    const x = cx + r * Math.cos(angles[i]);
    const y = cy + r * Math.sin(angles[i]);
    return `${x},${y}`;
  }).join(' ');
  const dataPolygon = `<polygon points="${dataPoints}" fill="#d6ad55" fill-opacity="0.24" stroke="#d6ad55" stroke-width="2"/>`;

  // Data points
  let dotsSvg = '';
  scores.forEach((s, i) => {
    const r = ((s.score ?? 0) / 5) * R;
    const x = cx + r * Math.cos(angles[i]);
    const y = cy + r * Math.sin(angles[i]);
    dotsSvg += `<circle cx="${x}" cy="${y}" r="4" fill="#d6ad55"/>`;
  });

  // Labels
  let labelsSvg = '';
  scores.forEach((s, i) => {
    const labelR = R + 26;
    const x = cx + labelR * Math.cos(angles[i]);
    const y = cy + labelR * Math.sin(angles[i]);
    let anchor = 'middle';
    if (Math.cos(angles[i]) > 0.3) anchor = 'start';
    else if (Math.cos(angles[i]) < -0.3) anchor = 'end';
    labelsSvg += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" fill="#e4e8f1" font-size="13" font-weight="600">${esc(s.icon)} ${esc(s.name)}</text>`;
    labelsSvg += `<text x="${x}" y="${y + 14}" text-anchor="${anchor}" dominant-baseline="middle" fill="#a7a394" font-size="11">${s.score === null ? 'н/д' : s.score.toFixed(1)}</text>`;
  });

  // Scale labels (only on top axis, for L1-L5)
  let scaleLabelsSvg = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const r = (lvl / 5) * R;
    scaleLabelsSvg += `<text x="${cx + 4}" y="${cy - r}" fill="#5a6478" font-size="9">${lvl}</text>`;
  }

  return `
    <svg class="radar-svg" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radar-title radar-desc">
      <title id="radar-title">Профиль зрелости по шести измерениям</title>
      <desc id="radar-desc">Диаграмма дополняется текстовой таблицей с точными значениями.</desc>
      ${gridSvg}
      ${axesSvg}
      ${dataPolygon}
      ${dotsSvg}
      ${scaleLabelsSvg}
      ${labelsSvg}
    </svg>
  `;
}

                <div class="gap-name">
                  <span>${esc(gap.icon)} ${esc(gap.name)}</span>
                  <span class="gap-current">Уровень L${gap.roundedScore}</span>
                </div>
                <div class="gap-rec">${esc(r.body)}</div>
              </div>
            `;
          }).join('')}
        </div>`:''}
      </div>

      ${choiceResolved?`<section class="panel" id="module-matches" style="margin-bottom:32px"><h3>Модули программы под ваши разрывы</h3><p class="panel-sub">Связь результата с конкретным учебным артефактом</p><div class="module-grid">${topGaps.map(g=>`<article class="module-card"><div class="eyebrow">РАЗРЫВ · ${esc(g.name)}</div><strong>${esc(MODULE_MAP[g.id][0])}</strong><div class="artifact">Что вы создадите: ${esc(MODULE_MAP[g.id][1])}</div><a class="btn btn-secondary" href="../../index.html#program">Посмотреть модуль</a></article>`).join('')}</div></section>`:''}

      <div class="recommendations">
        <h3>📋 Рекомендации по всем измерениям</h3>
        <p class="sub">Что делать в первую очередь для каждого измерения, исходя из вашего уровня</p>
        ${scores.map(d => {
          const rec = RECOMMENDATIONS[d.id];
          const r = rec[getRecLevel(d.roundedScore)];
          return `
            <details class="rec-card">
              <summary>${esc(d.icon)} ${esc(d.name)} · ${d.roundedScore===null?'Недостаточно данных':`L${d.roundedScore} → ${esc(r.title)}`}</summary>
              <div class="rec-body">${d.roundedScore===null?'Уточните хотя бы два ответа в этом измерении.':esc(r.body)}</div>
            </details>
          `;
        }).join('')}
      </div>

      ${renderResultCta(overallLevel,topGaps)}

      <div class="results-actions">
        <button class="btn btn-secondary" onclick="restart()">
          Пройти ещё раз
        </button>
        <button class="btn btn-primary" onclick="window.print()">
          📄 Сохранить как PDF
        </button>
      </div>

      <div class="level-reference">
        <h4>📚 Справка: 6 уровней AI Maturity Index v2026</h4>
        <div class="level-list">
          ${LEVEL_DESCRIPTIONS.map(l => `
            <div class="level-row">
              <div class="lvl">${esc(l.name)}</div>
              <div class="lvl-desc">${esc(l.desc)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderFooter() {
  return `
    <footer>
      <div class="meta">AI Maturity Assessment · 2026 · Директор по ИИ · AI MBA</div>
      <div>Ответы хранятся только в вашем браузере.</div>
    </footer>
  `;
}

function renderResultCta(level,gaps) {
  if(level===null||getDimensionScores().filter(s=>s.score!==null).length<4) return `<section class="cta-band"><div><div class="eyebrow">ПРЕДВАРИТЕЛЬНЫЙ РЕЗУЛЬТАТ</div><h3>Уточните ответы перед сохранением</h3><p>Нужно оценить минимум четыре измерения, чтобы передать корректный уровень в портал.</p></div><div class="cta-actions"><button class="btn btn-primary" onclick="returnToFirstInsufficient()">Уточнить ответы</button></div></section>`;
  if(state.source==='portal') return `<section class="cta-band"><div><div class="eyebrow">СОХРАНЕНО В ПОРТАЛЕ</div><h3>Продолжите маршрут с учётом результата</h3></div><div class="cta-actions"><a class="btn btn-primary" href="../../portal/?diag=maturity" onclick="track('maturity_portal_return')">Вернуться в портал с результатом</a><button class="btn btn-secondary" onclick="window.print()">Сохранить PDF</button></div></section>`;
  const ids=gaps.map(g=>g.id).join(',');
  return `<section class="cta-band"><div><div class="eyebrow">СЛЕДУЮЩИЙ ШАГ</div><h3>Получить разбор результатов</h3><p>За 30 минут определим первый проект, необходимые данные и модули программы под ваши разрывы.</p></div><div class="cta-actions"><a class="btn btn-primary" href="../../index.html?intent=maturity-review&level=L${level??'x'}&gaps=${encodeURIComponent(ids)}#apply" onclick="track('maturity_review_click')">Обсудить результат</a>${gaps.length?`<button class="btn btn-secondary" onclick="document.getElementById('module-matches').scrollIntoView({behavior:'smooth'})">Посмотреть модули</button>`:''}</div></section>`;
}

function saveCompletedResult() {
  const scores=getDimensionScores(), level=getOverallLevel(), confidence=getConfidence();
  if (level === null || scores.filter(s=>s.score!==null).length < 4) return false;
  const valid=scores.filter(s=>s.score!==null).sort((a,b)=>a.score-b.score); let candidates=[];
  for(const n of [...new Set(valid.map(s=>s.score))]){candidates.push(...valid.filter(s=>s.score===n));if(candidates.length>=3)break;}
  const selected=candidates.length>3?candidates.filter(g=>state.priorityGaps.includes(g.id)):candidates;
  return safeStorageSet(RESULT_KEY,JSON.stringify({v:2,assessmentVersion:ASSESSMENT_VERSION,completedAt:new Date().toISOString(),overallLevel:level,levelName:LEVEL_DESCRIPTIONS[level].name,scores,topGaps:selected.map(({id,name,roundedScore})=>({id,name,roundedScore})),equalPriorityCandidates:candidates.length>3?candidates.map(({id,name,roundedScore})=>({id,name,roundedScore})):[],confidence,source:state.source,answers:state.answers,priorityGaps:state.priorityGaps}));
}

/* ============================================================
   RENDER & ACTIONS
   ============================================================ */

function render() {
  let content;
  if (state.screen === 'welcome') content = renderWelcome();
  else if (state.screen === 'wizard') content = renderWizard();
  else if (state.screen === 'checkpoint') content = renderCheckpoint();
  else content = renderResults();

  document.getElementById('app').innerHTML = content + renderFooter();
  renderTopbar();
  if(state.storageWarning) document.getElementById('app').insertAdjacentHTML('afterbegin',`<div class="container"><p class="question-error" role="alert">${esc(state.storageWarning)}</p></div>`);
}
function renderAndFocus(){ render(); requestAnimationFrame(()=>document.getElementById('screen-title')?.focus({preventScroll:true})); window.scrollTo(0,0); }

function startAssessment(confirmReset) {
  if(confirmReset && !confirm('Ответы и текущий прогресс будут удалены. Начать заново?')) return;
  safeStorageRemove(DRAFT_KEY);
  state.screen = 'wizard';
  state.answers = {};
  state.currentDim = 0;
  state.priorityGaps=[]; state.pendingPriorityGaps=[]; state.priorityChoiceDeferred=false; render(); saveDraft(); track('maturity_started',{source:state.source});
  window.scrollTo(0, 0);
}

function selectOption(questionId, level, focusId) {
  state.answers[questionId] = level;
  state.errorQuestion=null; saveDraft(); render(); requestAnimationFrame(()=>document.getElementById(focusId)?.focus());
}

function goNext() {
  if(!isDimensionComplete(state.currentDim)) { const q=DIMENSIONS[state.currentDim].questions.find(q=>!Object.prototype.hasOwnProperty.call(state.answers,q.id)); state.errorQuestion=q.id; render(); requestAnimationFrame(()=>document.getElementById('legend-'+q.id)?.focus()); return; }
  if (state.currentDim === DIMENSIONS.length - 1) {
    state.screen = 'results';
    if (saveCompletedResult()) { safeStorageRemove(DRAFT_KEY); track('maturity_completed',{source:state.source,level:getOverallLevel()}); }
    else saveDraft();
  } else {
    state.screen='checkpoint';
  }
  renderAndFocus(); if(state.screen!=='results') saveDraft();
}

function goBack() {
  if (state.currentDim > 0) {
    state.currentDim--;
    renderAndFocus();
  }
}

function continueAfterCheckpoint(){ state.currentDim++; state.screen='wizard'; renderAndFocus(); saveDraft(); }
function editCheckpoint(){ state.screen='wizard'; renderAndFocus(); }
function resumeAssessment(){ const d=loadDraft(); if(!d)return startAssessment(false); Object.assign(state,d,{source:explicitSource&&['landing','portal'].includes(explicitSource)?explicitSource:d.source}); renderAndFocus(); }
function resumeResult(){ const r=loadCompleted(); if(!r)return; state.answers=r.answers||{}; state.priorityGaps=r.priorityGaps||[]; state.pendingPriorityGaps=[...state.priorityGaps]; state.priorityChoiceDeferred=false; state.screen='results'; renderAndFocus(); }
function updatePriorityDraft(id,checked,input){
  const current=[...state.pendingPriorityGaps];
  if(checked&&current.length>=3){ input.checked=false; document.getElementById('tie-message').textContent='Можно выбрать не более трёх областей.'; return; }
  state.pendingPriorityGaps=checked?[...current,id]:current.filter(x=>x!==id);
  document.getElementById('tie-count').textContent=`Выбрано ${state.pendingPriorityGaps.length} из 3`;
  document.getElementById('apply-priorities').disabled=state.pendingPriorityGaps.length===0;
  document.getElementById('tie-message').textContent='';
}
function applyPriorities(){ if(state.pendingPriorityGaps.length<1||state.pendingPriorityGaps.length>3)return; state.priorityGaps=[...state.pendingPriorityGaps]; state.priorityChoiceDeferred=false; saveCompletedResult(); render(); requestAnimationFrame(()=>document.getElementById('module-matches')?.scrollIntoView({block:'nearest'})); }
function deferPriorityChoice(){ state.priorityGaps=[]; state.pendingPriorityGaps=[]; state.priorityChoiceDeferred=true; saveCompletedResult(); render(); }
function beginPriorityChoice(){ state.priorityChoiceDeferred=false; state.pendingPriorityGaps=[]; render(); }
function returnToFirstInsufficient(){ const idx=getDimensionScores().findIndex(s=>s.score===null); state.currentDim=idx<0?0:idx; state.screen='wizard'; renderAndFocus(); }

function restart() {
  if(!confirm('Ответы и текущий прогресс будут удалены. Начать заново?')) return;
  safeStorageRemove(DRAFT_KEY);
  state.screen = 'wizard';
  state.answers = {};
  state.currentDim = 0;
  state.priorityGaps = [];
  state.pendingPriorityGaps = [];
  state.priorityChoiceDeferred = false;
  renderAndFocus(); saveDraft();
}

/* ============================================================
   INIT
   ============================================================ */

render();
window.addEventListener('beforeprint',()=>document.querySelectorAll('details.rec-card').forEach(d=>{d.dataset.wasOpen=d.open?'1':'0';d.open=true;}));
window.addEventListener('afterprint',()=>document.querySelectorAll('details.rec-card').forEach(d=>{if(d.dataset.wasOpen!=='1')d.open=false;}));
</script>

</body>
</html>
