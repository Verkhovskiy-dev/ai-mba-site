    text-align: center; color: var(--text-muted);
    font-size: 13px;

    .welcome h1 { font-size: 32px; }
    .info-grid { grid-template-columns: 1fr; }
    .results-grid { grid-template-columns: 1fr; }
    .level-list { grid-template-columns: 1fr; }

</style>

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function getTotalQuestions() {
  return DIMENSIONS.reduce((sum, d) => sum + d.questions.length, 0);
}

function getAnsweredCount() {
  return Object.keys(state.answers).length;
}

function getDimensionScores() {
  return DIMENSIONS.map(dim => {
    const scores = dim.questions.map(q => state.answers[q.id] !== undefined ? state.answers[q.id] : 0);
    const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
    return {
      id: dim.id,
      name: dim.name,
      icon: dim.icon,
      score: Math.round(avg * 10) / 10,
      roundedScore: Math.round(avg)
    };
  });
}

function getOverallLevel() {
  const scores = getDimensionScores();
  const avg = scores.reduce((s, d) => s + d.score, 0) / scores.length;
  return Math.round(avg);
}

function isDimensionComplete(dimIdx) {
  const dim = DIMENSIONS[dimIdx];
  return dim.questions.every(q => state.answers[q.id] !== undefined);
}

/* ============================================================
   SVG RADAR CHART
   ============================================================ */

function renderRadarChart(scores) {
  const size = 380;
  const cx = size / 2;
  const cy = size / 2;
  const R = 130;
  const angles = scores.map((_, i) => -Math.PI / 2 + (i * 2 * Math.PI) / scores.length);

  // Grid: 5 concentric polygons
  let gridSvg = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const r = (lvl / 5) * R;
    const points = angles.map(a => {
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      return `${x},${y}`;
    }).join(' ');
    gridSvg += `<polygon points="${points}" fill="none" stroke="#1f2740" stroke-width="1"/>`;
  }

  // Axes
  let axesSvg = '';
  angles.forEach((a, i) => {
    const x2 = cx + R * Math.cos(a);
    const y2 = cy + R * Math.sin(a);
    axesSvg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#1f2740" stroke-width="1"/>`;
  });

  // Data polygon
  const dataPoints = scores.map((s, i) => {
    const r = (s.score / 5) * R;
    const x = cx + r * Math.cos(angles[i]);
    const y = cy + r * Math.sin(angles[i]);
    return `${x},${y}`;
  }).join(' ');
  const dataPolygon = `<polygon points="${dataPoints}" fill="#6b8aff" fill-opacity="0.3" stroke="#6b8aff" stroke-width="2"/>`;

  // Data points
  let dotsSvg = '';
  scores.forEach((s, i) => {
    const r = (s.score / 5) * R;
    const x = cx + r * Math.cos(angles[i]);
    const y = cy + r * Math.sin(angles[i]);
    dotsSvg += `<circle cx="${x}" cy="${y}" r="4" fill="#6b8aff"/>`;
  });

  // Labels
  let labelsSvg = '';
  scores.forEach((s, i) => {
    const labelR = R + 26;
    const x = cx + labelR * Math.cos(angles[i]);
    const y = cy + labelR * Math.sin(angles[i]);
    let anchor = 'middle';
    if (Math.cos(angles[i]) > 0.3) anchor = 'start';
    else if (Math.cos(angles[i]) < -0.3) anchor = 'end';
    labelsSvg += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" fill="#e4e8f1" font-size="13" font-weight="600">${esc(s.icon)} ${esc(s.name)}</text>`;
    labelsSvg += `<text x="${x}" y="${y + 14}" text-anchor="${anchor}" dominant-baseline="middle" fill="#8590a8" font-size="11">${s.score.toFixed(1)}</text>`;
  });

  // Scale labels (only on top axis, for L1-L5)
  let scaleLabelsSvg = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const r = (lvl / 5) * R;
    scaleLabelsSvg += `<text x="${cx + 4}" y="${cy - r}" fill="#5a6478" font-size="9">${lvl}</text>`;
  }

  return `
    <svg class="radar-svg" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
      ${gridSvg}
      ${axesSvg}
      ${dataPolygon}
      ${dotsSvg}
      ${scaleLabelsSvg}
      ${labelsSvg}
    </svg>
  `;
}

      </div>
      <p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:14px;">
        Результат сохранён в этом браузере и автоматически появится в вашем портале слушателя.
      </p>

      <div class="level-reference">
        <h4>📚 Справка: 6 уровней AI Maturity Index v2026</h4>
        <div class="level-list">
          ${LEVEL_DESCRIPTIONS.map(l => `
            <div class="level-row">
              <div class="lvl">${esc(l.name)}</div>
              <div class="lvl-desc">${esc(l.desc)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderFooter() {
  return `
    <footer>
      <div class="meta">AI Maturity Self-Assessment v0.1 prototype · ${new Date().getFullYear()}</div>
      <div>Прототип учебного стенда AI MBA · Реальная production-версия будет в Q4 2026</div>
    </footer>
  `;
}

/* ============================================================
   RENDER & ACTIONS
   ============================================================ */

function render() {
  let content;
  if (state.screen === 'welcome') content = renderWelcome();
  else if (state.screen === 'wizard') content = renderWizard();
  else content = renderResults();

  document.getElementById('app').innerHTML = content + renderFooter();
}

function startAssessment() {
  state.screen = 'wizard';
  state.answers = {};
  state.currentDim = 0;
  render();
  window.scrollTo(0, 0);
}

function selectOption(questionId, level) {
  state.answers[questionId] = level;
  render();
}

function goNext() {
  if (state.currentDim === DIMENSIONS.length - 1) {
    state.screen = 'results';
    saveMaturityResult();
  } else {
    state.currentDim++;
  }
  render();
  window.scrollTo(0, 0);
}

const MATURITY_KEY = 'aimba_maturity_v1';
function saveMaturityResult() {
  try {
    const scores = getDimensionScores();
    const overallLevel = getOverallLevel();
    const data = {
      completedAt: new Date().toISOString(),
      overallLevel: overallLevel,
      levelName: (LEVEL_DESCRIPTIONS[overallLevel] || {}).name || ('L' + overallLevel),
      scores: scores.map(s => ({ id: s.id, name: s.name, score: s.score, roundedScore: s.roundedScore })),
      topGaps: [...scores].sort((a, b) => a.score - b.score).slice(0, 3).map(g => ({ id: g.id, name: g.name, roundedScore: g.roundedScore }))
    };
    localStorage.setItem(MATURITY_KEY, JSON.stringify(data));
  } catch (e) {}
}

function fromPortal() {
  return new URLSearchParams(location.search).get('from') === 'portal';
}

function goBack() {
  if (state.currentDim > 0) {
    state.currentDim--;
    render();
    window.scrollTo(0, 0);
  }
}

function restart() {
  state.screen = 'welcome';
  state.answers = {};
  state.currentDim = 0;
  render();
  window.scrollTo(0, 0);
}

/* ============================================================
   INIT
   ============================================================ */

render();
</script>

</body>
</html>
